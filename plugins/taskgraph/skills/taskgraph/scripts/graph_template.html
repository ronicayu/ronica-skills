<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>taskgraph</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #111418; color: #e5e7eb; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
:root { --bar: 48px; --panel-w: 0px; }
#toolbar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 6px 14px; min-height: 48px; background: #181c22; border-bottom: 1px solid #2a2f38; z-index: 3; overflow: visible; font-size: 13px; }
#toolbar > * { flex: none; }
#toolbar select, #toolbar input[type=text], #toolbar button { background: #232830; color: #e5e7eb; border: 1px solid #343a45; border-radius: 6px; padding: 5px 8px; font: inherit; }
#toolbar button { cursor: pointer; white-space: nowrap; }
#toolbar input::placeholder { color: #9ca3af; opacity: 1; }
#toolbar button:hover { background: #2d333d; }
#toolbar label { display: flex; align-items: center; gap: 5px; color: #9ca3af; white-space: nowrap; }
#toolbar [hidden] { display: none; }
#toolbar .seg { display: flex; }
#toolbar .seg button { padding: 5px 6px; }
#toolbar .seg button { border-radius: 0; }
#toolbar .seg button:first-child { border-radius: 6px 0 0 6px; }
#toolbar .seg button:last-child { border-radius: 0 6px 6px 0; }
#toolbar .seg button + button { margin-left: -1px; }
#toolbar .seg button.on { background: #3b4658; border-color: #566176; color: #fff; }
#toolbar .spacer { flex: 1 1 0; min-width: 0; }
#toolbar #goal { flex: 0 1 auto; max-width: min(320px, 40vw); }
#toolbar #goal.on { background: #3b4658; border-color: #566176; color: #fff; }
#toolbar .goalinfo, #searchCount { color: #9ca3af; font-size: 12px; white-space: nowrap; }
#toolbar .stamp { flex: 0 1 auto; min-width: 0; margin-left: auto; overflow: hidden; text-overflow: ellipsis; color: #9ca3af; font-size: 12px; white-space: nowrap; }
#toolbar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
#toolbar .dot.on { background: #34d399; }
#toolbar .dot.off { background: #ef4444; }
#cy { position: fixed; top: var(--bar); left: 0; right: 0; bottom: 0; }
#legend { position: fixed; left: 14px; bottom: 14px; max-width: calc(100vw - 28px - var(--panel-w, 0px)); background: #181c22cc; border: 1px solid #2a2f38; border-radius: 8px; padding: 4px 10px 6px; font-size: 12px; z-index: 2; }
#legendBody { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; }
#legend .col { display: contents; }
#legend.closed { padding-bottom: 4px; }
#legend.closed #legendBody { display: none; }
#legendToggle { background: none; border: 0; padding: 0; color: #9ca3af; font: inherit; font-size: 12px; cursor: pointer; }
#legendToggle:hover { color: #e5e7eb; }
#legend .col div { display: flex; align-items: center; gap: 6px; margin: 0; }
#legend .col div[hidden] { display: none; }
#legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; box-sizing: border-box; }
#legend svg { flex: none; overflow: visible; }
#panel { position: fixed; top: var(--bar); right: 0; bottom: 0; width: 340px; background: #181c22; border-left: 1px solid #2a2f38; padding: 16px; overflow-y: auto; display: none; z-index: 2; }
#panel h2 { margin: 0 0 6px; padding-right: 30px; font-size: 17px; line-height: 1.3; }
#panel .sub { color: #9ca3af; margin-bottom: 12px; }
#panel h3 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #9ca3af; }
#panel .badge { display: inline-block; padding: 1px 9px; border-radius: 10px; font-weight: 600; font-size: 12px; }
#panel .badge.late { background: #ef4444; color: #fff; border: 1px solid #ef4444; }
#panel .badge.chase { background: #f59e0b; color: #1c1004; border: 1px solid #f59e0b; }
#panel button { margin-top: 10px; background: #232830; color: #e5e7eb; border: 1px solid #343a45; border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer; }
#panel button:hover { background: #2d333d; }
#panel #panelClose { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; margin-top: 0; padding: 0; font-size: 18px; line-height: 1; }
#panel .notes { white-space: pre-wrap; background: #1e232b; border-radius: 6px; padding: 8px 10px; }
#panel table { width: 100%; border-collapse: collapse; }
#panel td { padding: 3px 6px; border-bottom: 1px solid #2a2f38; vertical-align: top; word-break: break-word; }
#panel td:first-child { color: #9ca3af; width: 35%; }
#panel ul { list-style: none; margin: 0; padding: 0; }
#panel li { padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
#panel li:hover { background: #232830; }
#panel li.off { opacity: .45; cursor: default; }
#panel li i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#panel .none { color: #9ca3af; }
#empty { position: fixed; top: var(--bar); left: 0; right: var(--panel-w, 0px); bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 1; }
#empty[hidden], #empty [hidden] { display: none; }
#empty p { margin: 0; font-size: 16px; color: #e5e7eb; }
#empty button { pointer-events: auto; margin-top: 10px; background: #232830; color: #e5e7eb; border: 1px solid #343a45; border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer; }
#empty button:hover { background: #2d333d; }
</style>
</head>
<body>
<div id="toolbar">
  <select id="project"></select>
  <select id="goal" title="Show only what one milestone or objective needs"></select>
  <span class="goalinfo" id="goalInfo" hidden></span>
  <span class="seg"><button id="viewGraph">Graph</button><button id="viewLanes">Swimlane</button><button id="viewTimeline">Timeline</button></span>
  <label id="lanesBy" hidden>Lanes by <select id="laneKey"><option>lane</option><option>owner</option><option>tag</option><option>project</option></select></label>
  <label id="depsBy" hidden>Dependencies <select id="depsMode"><option value="off">Conflicts only</option><option value="critical">Critical path</option><option value="all">All</option></select></label>
  <label><input type="checkbox" id="hideDone" checked> Hide done</label>
  <span class="seg" id="types"></span>
  <input type="text" id="search" placeholder="Search" size="9">
  <span id="searchCount" aria-live="polite"></span>
  <button id="expandAll">Expand all</button>
  <button id="collapseAll">Collapse all</button>
  <button id="relayout">Re-layout</button>
  <button id="fit">Fit</button>
  <button id="exportPng" title="Save the whole current view as a PNG image">Export PNG</button>
  <button id="refresh" hidden>Refresh</button>
  <span class="spacer"></span>
  <span class="stamp" id="stamp"></span>
</div>
<div id="cy"></div>
<div id="legend">
  <button id="legendToggle" title="Show or hide the legend">Legend ▾</button>
  <div id="legendBody">
  <div class="col">
    <div><svg width="28" height="16"><rect x="1" y="2" width="26" height="12" rx="4" fill="#e5e7eb"/></svg>Task</div>
    <div><svg width="28" height="16"><polygon points="14,0 22,8 14,16 6,8" fill="#2f3744" stroke="#9ca3af" stroke-width="1.5"/></svg>Milestone</div>
    <div><svg width="28" height="16"><polygon points="6,1 22,1 27,8 22,15 6,15 1,8" fill="#2f3744" stroke="#c4b5fd" stroke-width="2"/></svg>Decision</div>
    <div><svg width="28" height="16"><rect x="1" y="2" width="26" height="12" rx="4" fill="#2f3744" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/></svg>External</div>
  </div>
  <div class="col">
    <div><svg width="28" height="16"><rect x="2" y="2" width="24" height="12" fill="#181c22" stroke="#9ca3af" stroke-width="4"/><rect x="4" y="4" width="20" height="8" fill="none" stroke="#181c22" stroke-width="1.5"/></svg>Objective</div>
    <div><svg width="28" height="16"><polygon points="5,1 23,1 27,5 27,11 23,15 5,15 1,11 1,5" fill="#2f3744" stroke="#f59e0b" stroke-width="2"/></svg>Risk</div>
    <div><svg width="28" height="16"><polygon points="1,1 21,1 27,8 21,15 1,15" fill="#2f3744" stroke="#f87171" stroke-width="2"/></svg>Issue</div>
    <div id="legendRag"><svg width="28" height="16"><rect x="2" y="0" width="4" height="5" fill="#ef4444"/><rect x="2" y="5.5" width="4" height="5" fill="#f59e0b"/><rect x="2" y="11" width="4" height="5" fill="#34d399"/></svg>Lane RAG</div>
  </div>
  <div class="col" id="legendStatus"></div>
  <div class="col" id="legendMarks">
    <div id="legendBaseline"><svg width="28" height="16"><rect x="4" y="5" width="16" height="6" rx="2" fill="#6b7280"/><rect x="21" y="1" width="2" height="14" fill="#9ca3af"/></svg>Baseline due</div>
  </div>
  </div>
</div>
<div id="panel"></div>
<div id="empty" hidden><p id="emptyText"></p><button id="emptyAction" hidden></button></div>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<script>
let DATA = __DATA__;
const COLORS = {
  ready: { bg: '#e5e7eb', fg: '#0b0f14', bd: '#e5e7eb' },
  in_progress: { bg: '#34d399', fg: '#052e16', bd: '#34d399' },
  blocked: { bg: '#2f3744', fg: '#d1d5db', bd: '#6b7280' },
  done: { bg: '#2563eb', fg: '#ffffff', bd: '#2563eb', op: 0.85 }
};
const LABELS = { ready: 'Ready', in_progress: 'In progress', blocked: 'Blocked', done: 'Done' };
const GOAL = '#fbbf24';
const TYPES = ['task', 'milestone', 'decision', 'external', 'objective', 'risk', 'issue'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DATE_KEYS = ['date', 'decide_by', 'needed_by', 'chase', 'promised', 'due', 'review', 'raised'];
const ISSUE = '#f87171';
const RED = '#ef4444', AMBER = '#f59e0b', AXIS = '#6b7280';
const FIELDS = {
  task: [['owner', 'Owner'], ['estimate', 'Estimate']],
  milestone: [['date', 'Date']],
  decision: [['decider', 'Decider'], ['decide_by', 'Decide by']],
  external: [['party', 'Party'], ['contact', 'Contact'], ['needed_by', 'Needed by'], ['promised', 'Promised'], ['chase', 'Chase']],
  objective: [['owner', 'Owner']],
  risk: [['owner', 'Owner'], ['likelihood', 'Likelihood'], ['impact', 'Impact'], ['mitigation', 'Mitigation'], ['review', 'Review']],
  issue: [['owner', 'Owner'], ['severity', 'Severity'], ['raised', 'Raised'], ['due', 'Due']]
};
const todayYear = (DATA.today || new Date().toLocaleDateString('sv')).slice(0, 4);
const day = s => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  return m ? `${+m[3]} ${MONTHS[m[2] - 1]}` + (m[1] === todayYear ? '' : ' ' + m[1]) : String(s);
};
const HM = { hour: '2-digit', minute: '2-digit', hour12: false };
const SUBTITLE = {
  task: n => [n.due && 'due ' + day(n.due), n.meta.owner, n.meta.estimate != null && n.meta.estimate + 'h'],
  milestone: n => [n.due ? day(n.due) : 'no date'],
  decision: n => [n.due && 'decide by ' + day(n.due), n.meta.decider],
  external: n => n.chase_due ? [n.due && 'needed by ' + day(n.due)] : [n.meta.party, n.due && 'needed by ' + day(n.due), n.meta.chase && 'chase ' + day(n.meta.chase)],
  objective: n => [n.meta.owner],
  risk: n => [[n.meta.likelihood, n.meta.impact].filter(Boolean).join('/'), n.meta.owner, n.due && 'review ' + day(n.due)],
  issue: n => [n.meta.severity, n.meta.owner, n.due && 'due ' + day(n.due)]
};
const color = ele => COLORS[ele.data('derived_status')] || COLORS.blocked;
let byId = new Map(DATA.nodes.map(n => [n.id, n]));
const $ = id => document.getElementById(id);
let pinned = null;
const UNASSIGNED = 'Unassigned', OBJECTIVES = 'Objectives';
const GUTTER = 140, COL_W = 260, ROW_H = 88, NODE_W = 200, NODE_H = 52, READABLE = 0.9, MAX_FIT = 1.25;
const TL = { row: 28, head: 32, names: 290, px: 4, bar: 14, indent: 14 };
const FONT = 'system-ui, sans-serif', LABEL_W = NODE_W - 24, LABEL_LINES = 3, LANE_W = GUTTER - 28, MILESTONE_LANE_W = 112, DECISION_LANE_W = 150;
const LANE_KEYS = {
  lane: n => inheritedMeta(n, 'lane'),
  owner: n => n.meta.owner ?? n.meta.decider ?? n.meta.party,
  tag: n => Array.isArray(n.meta.tags) ? n.meta.tags[0] : n.meta.tags,
  project: n => n.project
};
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
const query = new URLSearchParams(location.search);
const VIEWS = ['graph', 'lanes', 'timeline'];
let view = VIEWS.find(v => v === (query.get('view') || store.get('taskgraph.view'))) || 'graph';
const DEPS = { '0': 'off', off: 'off', critical: 'critical', '1': 'all', all: 'all' };
let depsMode = DEPS[query.get('deps')] || DEPS[store.get('taskgraph.deps')] || 'off';
let laneKey = [query.get('lanes'), store.get('taskgraph.lanes')].find(k => Object.hasOwn(LANE_KEYS, k)) || 'lane';
const parseTypes = s => (s || '').split(',').filter(t => TYPES.includes(t));
let types = new Set([query.get('types'), store.get('taskgraph.types')].map(parseTypes).find(l => l.length) || TYPES);
const loadExpanded = () => {
  try {
    const v = JSON.parse(store.get('taskgraph.expanded'));
    return Array.isArray(v) ? new Set(v) : null;
  } catch (e) { return null; }
};
let expanded = loadExpanded();
const expandedIds = () => expanded || new Set(DATA.nodes.filter(n => n.type === 'objective').map(n => n.id));
const setExpanded = ids => {
  expanded = ids;
  store.set('taskgraph.expanded', JSON.stringify([...ids]));
};
const RAG_COLORS = { red: '#ef4444', amber: '#f59e0b', green: '#34d399' };
const ragOf = list => ['red', 'amber', 'green'].find(r => list.some(n => n.rag === r)) || 'green';
const isSummary = n => n.children.length > 0 || n.type === 'objective';
const bandRag = name => ragOf(DATA.nodes.filter(n => keeps(n) && laneOf(n) === name && (!isSummary(n) || n.type === 'objective')));
const stripe = (id, h, x, y, name) => {
  const rag = bandRag(name);
  return { group: 'nodes', classes: 'lane-rag bg', locked: true, selectable: false, grabbable: false, data: { id, h, color: RAG_COLORS[rag], rag }, position: { x, y } };
};
const bandRank = s => s === OBJECTIVES ? 0 : s === UNASSIGNED ? 2 : 1;
const bandOrder = (a, b) => bandRank(a) - bandRank(b) || a.toLowerCase().localeCompare(b.toLowerCase());
const inheritedMeta = (n, key) => {
  for (; n; n = byId.get(n.parent)) {
    const v = n.meta[key];
    if (v != null && String(v).trim()) return String(v).trim();
  }
  return null;
};
const descendants = n => n.children.reduce((sum, c) => sum + 1 + descendants(byId.get(c)), 0);

function el(tag, props, ...children) {
  const e = Object.assign(document.createElement(tag), props || {});
  e.append(...children.filter(c => c != null));
  return e;
}

// Cytoscape wraps only at spaces, so CJK and URLs never break and long titles spill out of
// fixed Swimlane boxes. Wrap here instead, breaking anywhere when a line has no space, and
// end the last allowed line with an ellipsis. Measured bold so goal labels fit as well.
const ctx = document.createElement('canvas').getContext('2d');
ctx.font = 'bold 13px ' + FONT;
const clamped = new Map();
function clampLabel(text, width, maxLines) {
  const key = width + ':' + maxLines + ':' + text;
  if (clamped.has(key)) return clamped.get(key);
  const fits = s => ctx.measureText(s).width <= width;
  const wide = c => /[\u2e80-\u9fff\uac00-\ud7af\uf900-\ufaff\uff00-\uffef]/.test(c);
  let rest = Array.from(text.trim().replace(/\s+/g, ' '));
  const lines = [];
  while (rest.length && lines.length < maxLines) {
    let n = rest.length;
    if (!fits(rest.join(''))) {
      n = 1;
      while (n < rest.length && fits(rest.slice(0, n + 1).join(''))) n++;
      const sp = rest.lastIndexOf(' ', n);
      if (rest[n] !== ' ' && !wide(rest[n - 1]) && !wide(rest[n]) && sp > 0) n = sp;
    }
    lines.push(rest.slice(0, n).join('').trim());
    rest = rest.slice(n);
    while (rest[0] === ' ') rest.shift();
  }
  if (rest.length) {
    let last = Array.from(lines.pop());
    while (last.length && !fits(last.join('').trimEnd() + '…')) last.pop();
    lines.push(last.join('').trimEnd() + '…');
  }
  const label = lines.join('\n');
  clamped.set(key, label);
  return label;
}

const cy = cytoscape({
  container: $('cy'),
  minZoom: 0.1,
  maxZoom: 3,
  wheelSensitivity: 0.3,
  style: [
    { selector: 'node', style: {
      'shape': 'round-rectangle', 'width': 'label', 'height': 'label', 'padding': '12px',
      'label': 'data(label)', 'text-wrap': 'wrap', 'text-max-width': LABEL_W + 8,
      'text-valign': 'center', 'text-halign': 'center', 'font-size': 13,
      'font-family': FONT, 'color': ele => color(ele).fg,
      'background-color': ele => color(ele).bg, 'border-width': 2, 'border-color': ele => color(ele).bd,
      'opacity': ele => color(ele).op || 1, 'transition-property': 'opacity', 'transition-duration': '120ms'
    } },
    { selector: 'node.summary', style: { 'border-width': 3 } },
    { selector: 'node[type="milestone"]', style: {
      'shape': 'diamond', 'width': 46, 'height': 46, 'padding': 0, 'text-valign': 'bottom', 'text-margin-y': 6,
      'color': '#e5e7eb', 'border-color': '#9ca3af', 'font-weight': 'bold'
    } },
    { selector: 'node[type="decision"]', style: { 'shape': 'hexagon', 'padding': '20px', 'border-color': '#c4b5fd', 'border-width': 2 } },
    { selector: 'node[type="external"]', style: { 'border-style': 'dashed', 'border-color': '#9ca3af', 'border-width': 2 } },
    { selector: 'node[type="risk"]', style: { 'shape': 'cut-rectangle', 'border-color': AMBER, 'border-width': 2 } },
    { selector: 'node[type="issue"]', style: { 'shape': 'tag', 'padding': '16px', 'border-color': ISSUE, 'border-width': 2 } },
    { selector: 'node[type="objective"]', style: {
      'shape': 'rectangle', 'padding': '14px', 'background-color': '#181c22', 'color': '#e5e7eb', 'font-weight': 'bold',
      'border-style': 'double', 'border-width': 6, 'border-color': '#9ca3af'
    } },
    { selector: 'node.goal', style: { 'border-width': 3, 'border-color': GOAL, 'font-weight': 'bold' } },
    { selector: 'node.atrisk', style: { 'outline-width': 4, 'outline-offset': 2, 'outline-color': AMBER, 'outline-opacity': 0.9 } },
    { selector: 'node.late, node.conflict', style: { 'outline-width': 4, 'outline-offset': 2, 'outline-color': RED, 'outline-opacity': 0.8 } },
    { selector: 'node.lanes', style: { 'width': NODE_W, 'height': NODE_H, 'padding': 0 } },
    { selector: 'node.lanes[type="milestone"]', style: {
      'text-valign': 'center', 'text-margin-y': 0, 'text-max-width': MILESTONE_LANE_W + 8, 'font-size': 11, 'font-weight': 'normal', 'color': ele => color(ele).fg
    } },
    { selector: 'node.lane-bg', style: {
      'shape': 'rectangle', 'width': 'data(w)', 'height': 'data(h)', 'padding': 0, 'background-color': 'data(shade)',
      'border-width': 1, 'border-color': '#262c36', 'opacity': 1, 'events': 'no',
      'label': 'data(name)', 'text-wrap': 'wrap', 'text-max-width': LANE_W + 8, 'text-halign': 'right', 'text-valign': 'center',
      'text-margin-x': 'data(tx)', 'color': '#9ca3af', 'font-weight': 'bold', 'font-size': 13, 'z-index-compare': 'manual', 'z-index': -1
    } },
    { selector: 'edge', style: {
      'curve-style': 'bezier', 'width': 1.5, 'line-color': '#6b7280',
      'target-arrow-shape': 'triangle', 'target-arrow-color': '#6b7280', 'arrow-scale': 1.2, 'overlay-padding': 6
    } },
    { selector: 'edge.lanes, edge.tl', style: { 'curve-style': 'segments', 'edge-distances': 'node-position' } },
    { selector: 'edge.partof', style: { 'line-style': 'dotted', 'line-color': '#6b7280', 'target-arrow-color': '#6b7280', 'target-arrow-shape': 'none' } },
    { selector: 'edge.lifted, edge.bridged', style: { 'line-style': 'dashed' } },
    { selector: 'edge.threat', style: { 'line-style': 'dotted', 'line-color': AMBER, 'target-arrow-color': AMBER } },
    { selector: 'edge.back', style: { 'curve-style': 'bezier', 'line-style': 'dashed', 'line-color': AMBER, 'target-arrow-color': AMBER } },
    { selector: 'node.tl', style: {
      'width': 'data(w)', 'height': 'data(h)', 'padding': 0, 'shape': 'round-rectangle', 'border-width': 0, 'border-style': 'solid',
      'text-halign': 'right', 'text-valign': 'center', 'text-margin-x': 6, 'text-margin-y': 0, 'text-wrap': 'none',
      'font-size': 12, 'font-weight': 'normal', 'color': '#9ca3af', 'z-index-compare': 'manual', 'z-index': 2
    } },
    { selector: 'node.tl.mk-pt', style: { 'shape': 'ellipse' } },
    { selector: 'node.tl.mk-sum', style: {
      'shape': 'rectangle', 'background-fill': 'linear-gradient', 'background-gradient-direction': 'to-right',
      'background-gradient-stop-colors': COLORS.done.bg + ' ' + COLORS.done.bg + ' ' + AXIS + ' ' + AXIS,
      'background-gradient-stop-positions': ele => `0% ${ele.data('pct')}% ${ele.data('pct')}% 100%`
    } },
    { selector: 'node.tl[type="milestone"]', style: { 'shape': 'diamond', 'border-width': 1.5, 'border-color': '#9ca3af' } },
    { selector: 'node.tl[type="decision"]', style: { 'shape': 'hexagon', 'background-opacity': 0.25, 'border-width': 2, 'border-color': '#c4b5fd' } },

let goal = Number(query.get('goal')) || null;
let scopeMemo = { goal: null, data: null, ids: null };

// Everything a goal needs: what it depends on, followed all the way down (finished work too),
// the children of summaries on the way, dependencies inherited from parents, and the risks
// pointing at any of it. Ancestors come along so collapsed summaries still show.
function goalScope() {
  if (goal == null || !byId.has(goal)) return null;
  if (scopeMemo.goal === goal && scopeMemo.data === DATA) return scopeMemo.ids;
  const ids = new Set();
  const visit = id => {
    if (ids.has(id) || !byId.has(id)) return;
    ids.add(id);
    const n = byId.get(id);
    [...n.depends_on, ...n.children, ...(n.threats ?? [])].forEach(visit);
    for (let p = byId.get(n.parent); p; p = byId.get(p.parent)) p.depends_on.forEach(visit);
  };
  visit(goal);
  [...ids].forEach(id => {
    for (let p = byId.get(byId.get(id).parent); p; p = byId.get(p.parent)) ids.add(p.id);
  });
  scopeMemo = { goal, data: DATA, ids };
  return ids;
}

const keeps = n => {
  const project = $('project').value;
  const scope = goalScope();
  return (!project || n.project === project || (scope && scope.has(n.id))) && (!scope || scope.has(n.id))
    && !($('hideDone').checked && n.derived_status === 'done');
};
const passes = n => keeps(n) && types.has(n.type);

function topOf(n, open) {
  const chain = [n];
  while (byId.has(chain[0].parent)) chain.unshift(byId.get(chain[0].parent));
  return chain.find(a => !open.has(a.id)) || n;
}

function visibleData() {
  const open = expandedIds();
  const put = (map, s, t, f) => {
    if (s === t) return;
    const k = s + '-' + t, o = map.get(k);
    f = { partof: false, lifted: false, bridged: false, ...f };
    map.set(k, o ? { s, t, partof: o.partof && f.partof, lifted: o.lifted && f.lifted, bridged: o.bridged && f.bridged } : { s, t, ...f });
  };
  const level = DATA.nodes.filter(n => topOf(n, open) === n);
  const mapped = new Map();
  DATA.edges.forEach(e => {
    const a = topOf(byId.get(e.source), open).id, b = topOf(byId.get(e.target), open).id;
    put(mapped, a, b, { lifted: a !== e.source || b !== e.target });
  });
  level.filter(p => p.children.length && open.has(p.id)).forEach(p => p.children.forEach(c => put(mapped, c, p.id, { partof: true })));
  const alive = new Set(level.filter(keeps).map(n => n.id));
  const shown = new Set(level.filter(n => alive.has(n.id) && types.has(n.type)).map(n => n.id));
  const out = new Map([...alive].map(id => [id, []]));
  [...mapped.values()].filter(e => alive.has(e.s) && alive.has(e.t)).forEach(e => out.get(e.s).push(e));
  const result = new Map();
  const walk = (s, e, acc, seen) => {
    const f = { partof: acc.partof && e.partof, lifted: acc.lifted || e.lifted, bridged: acc.bridged };
    if (shown.has(e.t)) return put(result, s, e.t, f);
    if (seen.has(e.t)) return;
    seen.add(e.t);
    out.get(e.t).forEach(next => walk(s, next, { ...f, bridged: true }, seen));
  };
  shown.forEach(s => out.get(s).forEach(e => walk(s, e, { partof: true, lifted: false, bridged: false }, new Set())));
  const next = new Map(level.map(n => [n.id, []]));
  [...result.values()].filter(e => !e.partof).forEach(e => next.get(e.s).push(e.t));
  const under = (id, p) => {
    for (let n = byId.get(id); byId.has(n.parent); n = byId.get(n.parent)) if (n.parent === p) return true;
    return false;
  };
  const reaches = (from, p) => {
    const seen = new Set([from]);
    const stack = [from];
    while (stack.length) {
      for (const t of next.get(stack.pop())) {
        if (under(t, p)) return true;
        if (!seen.has(t)) {
          seen.add(t);
          stack.push(t);
        }
      }
    }
    return false;
  };
  const direct = [...result.entries()].filter(([, e]) => e.partof && !e.bridged);
  groupBy(direct, ([, e]) => e.t).forEach(group => {
    const redundant = group.filter(([, e]) => reaches(e.s, e.t));
    if (redundant.length < group.length) redundant.forEach(([k]) => result.delete(k));
  });
  const edges = [...result.values()].map(e => ({
    id: e.s + '-' + e.t, source: e.s, target: e.t, kind: ['partof', 'lifted', 'bridged'].filter(k => e[k]).join(' ')
  }));
  return { nodes: level.filter(n => shown.has(n.id)), edges, open };
}

// A collapsed summary must not hide trouble: count late and conflicting open work beneath it.
const collapsed = n => n.children.length > 0 && !expandedIds().has(n.id);
const beneath = n => n.children.flatMap(c => byId.has(c) ? [byId.get(c), ...beneath(byId.get(c))] : []);
function trouble(n) {
  const open = beneath(n).filter(k => k.derived_status !== 'done' && k.type !== 'risk' && keeps(k));
  return { late: open.filter(k => k.late_days != null).length, conflicts: open.filter(conflicted).length };
}
const troubleText = n => {
  if (!collapsed(n)) return null;
  const t = trouble(n);
  return t.late ? t.late + ' late inside' : t.conflicts ? (t.conflicts === 1 ? '1 conflict' : t.conflicts + ' conflicts') + ' inside' : null;
};

// Who to chase is the point of a chase-due external, so name the party rather than "chase due".
const chaseText = n => n.meta.party ? 'chase ' + n.meta.party : 'chase due';

function labelOf(n, open) {
  const m = n.meta;
  const parts = isSummary(n)
    ? [m.owner, n.rollup && n.rollup.total ? `${n.rollup.done}/${n.rollup.total} done` : null]
    : (SUBTITLE[n.type] || SUBTITLE.task)(n);
  if (n.children.length && !open.has(n.id)) parts.unshift('▸ ' + descendants(n));
  if (troubleText(n)) parts.unshift(troubleText(n));
  if (n.chase_due) parts.unshift(chaseText(n));
  if (conflicted(n)) parts.unshift('conflict');
  if (atRisk(n)) parts.unshift('at risk');
  if (n.late_days != null) parts.unshift(n.late_days + 'd late');
  const sub = parts.filter(Boolean).join(' · ');
  const width = view !== 'lanes' ? LABEL_W : n.type === 'milestone' ? MILESTONE_LANE_W : n.type === 'decision' ? DECISION_LANE_W : LABEL_W;
  const [titleLines, subLines] = view === 'lanes' ? [2, 1] : [3, 2];
  const title = clampLabel('#' + n.id + ' ' + n.title, width, sub ? titleLines : titleLines + subLines);
  return sub ? title + '\n' + clampLabel(sub, width, subLines) : title;
}

const nodeData = (n, open) => ({ id: String(n.id), type: n.type, derived_status: n.derived_status, title: n.title, label: view === 'timeline' ? dateText(n) : labelOf(n, open) });
const flagsOf = (n, sources) => ({
  summary: isSummary(n),
  late: n.late_days != null || (collapsed(n) && trouble(n).late > 0),
  conflict: conflicted(n),
  atrisk: atRisk(n),
  goal: !sources.has(n.id) && (n.type === 'milestone' || n.type === 'objective')
});
const classesOf = (n, sources) => Object.entries(flagsOf(n, sources)).filter(([, on]) => on).map(([k]) => k).join(' ');
const tasks = () => cy.nodes().not('.bg');
const links = () => cy.edges().not('.bg');
const conflicted = n => (n.conflicts ?? []).length > 0;
const atRisk = n => !!(n.outlook && n.outlook.verdict === 'at_risk' && n.derived_status !== 'done');
function outlookText(o) {
  if (o.verdict === 'on_track') return 'On track' + (o.min_slack != null ? ` · min slack ${o.min_slack > 0 ? '+' : ''}${o.min_slack}d` : '');
  if (o.verdict === 'unknown') return 'Unknown · nothing upstream has a date';
  const parts = [];
  if (o.late_upstream.length) parts.push(o.late_upstream.length + ' late upstream');
  if (o.negative_slack) parts.push(o.negative_slack + ' negative slack');
  if (o.min_slack != null) parts.push(`min slack ${o.min_slack > 0 ? '+' : ''}${o.min_slack}d`);
  return 'At risk' + (parts.length ? ' · ' + parts.join(' · ') : '');
}
const laneOf = n => {
  const v = LANE_KEYS[laneKey](n);
  return v == null || String(v).trim() === '' ? (n.type === 'objective' ? OBJECTIVES : UNASSIGNED) : String(v).trim();
};

const gapAfter = c => GUTTER + (c + 1) * COL_W;
const colOf = x => Math.round((x - GUTTER - COL_W / 2) / COL_W);

const groupBy = (items, key) => {
  const m = new Map();
  items.forEach(i => {
    const k = key(i);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(i);
  });
  return [...m.values()];
};
const trackUnit = j => (j % 2 ? -(j + 1) / 2 : j / 2);
const portOffset = (k, i) => (i - (k - 1) / 2) * (k > 1 ? Math.min(8, (NODE_H - 6) / (k - 1)) : 0);

function assignTracks(items) {
  const ends = [];
  items.sort((p, q) => p.lo - q.lo);
  items.forEach(it => {
    let j = 0;
    while (ends[j] !== undefined && it.lo - ends[j] <= 4) j++;
    ends[j] = it.hi;
    it.slot = j;
  });
  return ends.length;
}

function backEdges(nodes, edges) {
  const out = new Map(nodes.map(n => [n.id, []]));
  edges.forEach(e => out.get(e.source).push(e));
  const state = new Map();
  const back = new Set();
  const visit = id => {
    state.set(id, 1);
    out.get(id).forEach(e => {
      if (state.get(e.target) === 1) back.add(e.id);
      else if (!state.has(e.target)) visit(e.target);
    });
    state.set(id, 2);
  };
  nodes.forEach(n => state.has(n.id) || visit(n.id));
  return back;
}

function elbow(s, t, points) {
  const vx = t.x - s.x, vy = t.y - s.y, len2 = vx * vx + vy * vy;
  return {
    'segment-weights': points.map(([x, y]) => ((x - s.x) * vx + (y - s.y) * vy) / len2).join(' '),
    'segment-distances': points.map(([x, y]) => ((y - s.y) * vx - (x - s.x) * vy) / Math.sqrt(len2)).join(' ')
  };
}

function routeEdges() {
  const rs = cy.edges().not('.back').map(edge => {
    const s = edge.source().position(), t = edge.target().position();
    const cs = colOf(s.x), ct = colOf(t.x);
    return { edge, s, t, sid: edge.source().id(), tid: edge.target().id(), a: gapAfter(cs), b: gapAfter(ct - 1), long: ct > cs + 1, base: s.y <= t.y ? t.y - ROW_H / 2 : t.y + ROW_H / 2 };
  });
  groupBy(rs, r => r.sid).forEach(g => {
    g.sort((p, q) => p.t.y - q.t.y || p.tid - q.tid);
    g.forEach((r, i) => { r.sy = r.s.y + portOffset(g.length, i); });
  });
  groupBy(rs, r => r.tid).forEach(g => {
    g.sort((p, q) => p.s.y - q.s.y || p.sid - q.sid);
    g.forEach((r, i) => { r.ty = r.t.y + portOffset(g.length, i); });
  });
  const bends = r => r.long || r.sy !== r.ty;
  rs.filter(bends).forEach(q => {
    if (rs.some(p => p !== q && bends(p) && p.a === q.b && Math.abs(p.sy - q.ty) < 1)) q.ty += 2;
  });
  groupBy(rs.filter(r => r.long), r => r.base).forEach(g => {
    const items = g.map(r => ({ r, lo: r.a, hi: r.b }));
    const step = Math.min(6, 24 / assignTracks(items));
    items.forEach(it => { it.r.y = it.r.base + trackUnit(it.slot) * step; });
  });
  const verts = rs.flatMap(r => {
    const span = (y1, y2) => ({ r, lo: Math.min(y1, y2), hi: Math.max(y1, y2) });
    if (r.long) {
      r.va = { ...span(r.sy, r.y), gap: r.a };
      r.vb = { ...span(r.y, r.ty), gap: r.b };
    } else if (r.sy !== r.ty) r.va = r.vb = { ...span(r.sy, r.ty), gap: r.a };
    return r.va === r.vb ? (r.va ? [r.va] : []) : [r.va, r.vb];
  });
  groupBy(verts, v => v.gap).forEach(g => {
    const step = Math.min(8, 48 / assignTracks(g));
    g.forEach(v => { v.x = v.gap + trackUnit(v.slot) * step; });
  });
  rs.forEach(r => {
    const { s, t, edge } = r;
    const style = { 'source-endpoint': `${NODE_W / 2}px ${r.sy - s.y}px`, 'target-endpoint': `${-NODE_W / 2}px ${r.ty - t.y}px` };
    if (!r.va) style['curve-style'] = 'straight';
    else Object.assign(style, elbow(s, t, r.long ? [[r.va.x, r.sy], [r.va.x, r.y], [r.vb.x, r.y], [r.vb.x, r.ty]] : [[r.va.x, r.sy], [r.va.x, r.ty]]));
    edge.style(style);
  });
}

function layoutLanes(fit) {
  const { nodes, edges } = visibleData();
  const back = backEdges(nodes, edges);
  const next = new Map(nodes.map(n => [n.id, []]));
  edges.filter(e => !back.has(e.id)).forEach(e => next.get(e.source).push(e.target));
  const up = new Map();
  const depth = id => {
    if (!up.has(id)) up.set(id, Math.max(-1, ...next.get(id).map(depth)) + 1);
    return up.get(id);
  };
  const maxUp = Math.max(0, ...nodes.map(n => depth(n.id)));
  const groups = new Map();
  nodes.forEach(n => {
    const name = laneOf(n);
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(n);
  });
  const names = [...groups.keys()].sort(bandOrder);
  const width = GUTTER + (maxUp + 1) * COL_W;
  let top = 0;
  const stripes = [];
  const bands = names.map((name, i) => {
    const rows = new Map();
    groups.get(name).sort((a, b) => a.id - b.id).forEach(n => {
      const col = maxUp - up.get(n.id);
      const row = rows.get(col) || 0;
      rows.set(col, row + 1);
      cy.getElementById(String(n.id)).position({ x: GUTTER + col * COL_W + COL_W / 2, y: top + row * ROW_H + ROW_H / 2 });
    });
    const height = Math.max(...rows.values()) * ROW_H;
    const band = {
      group: 'nodes', classes: 'lane-bg bg', locked: true, selectable: false, grabbable: false,
      data: { id: 'lane:' + i, name: clampLabel(name, LANE_W, 2) + '\n' + bandRag(name).toUpperCase(), w: width, h: height, tx: 14 - width, shade: i % 2 ? '#171b22' : '#14181e' },
      position: { x: width / 2, y: top + height / 2 }
    };
    stripes.push(stripe('lane-rag:' + i, height, 4, top + height / 2, name));
    top += height;
    return band;
  });
  cy.add([...bands, ...stripes]);
  cy.edges().forEach(e => e.toggleClass('back', back.has(e.id())));
  routeEdges();
  if (fit) fitView();
}

const dnum = s => {
  const [y, m, d] = s.split('-');
  return Date.UTC(y, m - 1, d) / 864e5;
};
const isPoint = n => n.type === 'milestone' || n.type === 'decision' || n.type === 'risk';

function datesOf(n) {
  const span = isSummary(n) ? n.span : null;
  const start = n.start ?? null, due = n.due ?? null;
  const a = span ? span.start : isPoint(n) ? due ?? start : start ?? due;
  const b = span ? span.end : isPoint(n) ? a : due ?? start;
  return a ? [a, b] : null;
}

function dateText(n) {
  const d = datesOf(n);
  if (!d) return '';
  const parts = [d[0] === d[1] ? day(d[0]) : day(d[0]) + '–' + day(d[1])];
  if (isSummary(n) && n.rollup && n.rollup.total) parts.push(`${n.rollup.done} of ${n.rollup.total} done`);
  if (troubleText(n)) parts.push(troubleText(n));
  if (n.late_days != null) parts.push(n.late_days + 'd late');
  if (atRisk(n)) parts.push('at risk');
  if (conflicted(n)) parts.push('conflict');
  if (n.chase_due) parts.push(chaseText(n));
  return parts.join(' · ');
}

function criticalEdges(open) {
  const ids = new Set();
  DATA.nodes.filter(n => n.outlook && n.derived_status !== 'done' && keeps(n)).forEach(n => {
    const chain = (n.outlook.driving || []).filter(i => byId.has(i)).map(i => topOf(byId.get(i), open).id);
    chain.slice(1).forEach((b, i) => { if (chain[i] !== b) ids.add(chain[i] + '-' + b); });
  });
  return ids;
}

function conflictEdges(open) {
  const ids = new Set();
  DATA.nodes.forEach(n => (n.conflicts ?? []).filter(c => c.kind === 'dependency' && byId.has(c.with)).forEach(c => {
    const w = byId.get(c.with);
    const a = topOf(n, open).id, b = topOf(w, open).id;
    ids.add(a + '-' + b).add(b + '-' + a);
  }));
  return ids;
}

function routeDeps(shown, marks, right) {
  const rs = shown.map(edge => {
    const s = marks.get(edge.source().id()), t = marks.get(edge.target().id());
    const dir = t.y > s.y ? 1 : -1;
    return { edge, s, t, dir, y1: s.y + dir * TL.row / 2, y2: t.y - dir * TL.row / 2 };
  });
  const ports = new Map();
  const dock = (m, side, r, end, far) => {
    const key = m.id + side;
    ports.set(key, [...(ports.get(key) || []), { m, r, end, far }]);
  };
  rs.forEach(r => {
    dock(r.s, r.dir, r, 'ex', r.t);
    dock(r.t, -r.dir, r, 'nx', r.s);
  });
  ports.forEach(g => {
    g.sort((p, q) => p.far.x - q.far.x);
    g.forEach((p, i) => { p.r[p.end] = p.m.x + (i + 0.5 - g.length / 2) * Math.min(4, (p.m.x2 - p.m.x1 - 2) / g.length); });
  });
  rs.filter(r => r.y1 !== r.y2).forEach(r => {
    const lo = Math.min(r.s.y, r.t.y), hi = Math.max(r.s.y, r.t.y);
    const between = [...marks.values()].filter(m => m.y > lo && m.y < hi);
    const free = x => !between.some(m => m.from < x && x < m.end + 4);
    const cost = x => Math.abs(r.ex - x) + Math.abs(x - r.nx);
    let best = TL.names + 8;
    for (let x = best; x <= right; x += 6) if (free(x) && cost(x) < cost(best)) best = x;
    r.xc = best;
  });
  groupBy(rs.filter(r => r.xc != null), r => r.xc).forEach(g => {
    const items = g.map(r => ({ r, lo: Math.min(r.y1, r.y2), hi: Math.max(r.y1, r.y2) }));
    assignTracks(items);
    items.forEach(it => { it.r.xc -= it.slot * 3; });
  });
  const runs = rs.flatMap(r => {
    const mid = r.xc ?? r.nx;
    r.h1 = { lo: Math.min(r.ex, mid), hi: Math.max(r.ex, mid), y: r.y1 };
    r.h2 = r.xc == null ? r.h1 : { lo: Math.min(mid, r.nx), hi: Math.max(mid, r.nx), y: r.y2 };
    return r.h1 === r.h2 ? [r.h1] : [r.h1, r.h2];
  });
  groupBy(runs, h => h.y).forEach(g => {
    const step = Math.min(2, 4 / assignTracks(g));
    g.forEach(h => { h.off = trackUnit(h.slot) * step; });
  });
  rs.forEach(r => {
    const ya = r.y1 + r.h1.off, yd = r.y2 + r.h2.off;
    const raw = r.xc == null ? [[r.ex, ya], [r.nx, ya]] : [[r.ex, ya], [r.xc, ya], [r.xc, yd], [r.nx, yd]];
    const points = raw.filter((p, i) => i === 0 || p[0] !== raw[i - 1][0] || p[1] !== raw[i - 1][1]);
    const style = {
      'source-endpoint': `${r.ex - r.s.x}px ${r.dir * r.s.h / 2}px`,
      'target-endpoint': `${r.nx - r.t.x}px ${-r.dir * r.t.h / 2}px`
    };
    if (points.length === 2 && points[0][0] === points[1][0]) style['curve-style'] = 'straight';
    else Object.assign(style, elbow(r.s, r.t, points));
    r.edge.style(style);
  });
}

function layoutTimeline(fit) {
  const { nodes, open } = visibleData();
  if (!nodes.length) return;
  const shown = new Set(nodes.map(n => n.id));
  const nests = n => !!datesOf(n) && shown.has(n.parent) && laneOf(n) === laneOf(byId.get(n.parent));
  const kids = new Map(nodes.map(n => [n.id, n.children.filter(c => shown.has(c)).map(c => byId.get(c)).filter(nests)]));
  const cmp = (a, b) => (b.type === 'milestone') - (a.type === 'milestone') || (datesOf(a)?.[0] ?? '~').localeCompare(datesOf(b)?.[0] ?? '~') || a.id - b.id;
  const groups = new Map();
  nodes.filter(n => !nests(n)).forEach(n => {
    const name = datesOf(n) ? laneOf(n) : null;
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(n);
  });
  const names = [...groups.keys()].filter(k => k !== null).sort(bandOrder);
  if (groups.has(null)) names.push(null);
  const rows = [];
  const spans = [];
  const walk = (n, depth) => {
    rows.push({ n, depth });
    kids.get(n.id).sort(cmp).forEach(c => walk(c, depth + 1));
  };
  names.forEach(name => {
    const from = rows.length, head = name === null ? 'Undated' : name;
    rows.push({ head, undated: name === null });
    groups.get(name).sort(cmp).forEach(n => walk(n, 0));
    spans.push([from, rows.length, head, name === null]);
  });
  const today = DATA.today || new Date().toLocaleDateString('sv');
  const baseDue = n => n.baseline && n.baseline.due && n.baseline.due !== n.due && datesOf(n) ? n.baseline.due : null;
  const days = [today, ...rows.flatMap(r => r.n ? [...(datesOf(r.n) || []), baseDue(r.n)].filter(Boolean) : [])].map(dnum);
  const lo = Math.min(...days) - 7, hi = Math.max(...days) + 14;
  const left = TL.names + 16;
  const xOf = d => left + (dnum(d) - lo) * TL.px;
  const height = TL.head + rows.length * TL.row;
  const yOf = i => TL.head + i * TL.row + TL.row / 2;
  const bg = (classes, id, data, x, y) => ({ group: 'nodes', classes: 'bg ' + classes, locked: true, selectable: false, grabbable: false, data: { id, ...data }, position: { x, y } });
  const els = [];
  const marks = new Map();
  rows.forEach((r, i) => {
    const y = yOf(i);
    if (r.head) return els.push(bg('tl-name tl-head', 'tl:name:' + i, { name: r.undated ? r.head : r.head + ' · ' + bandRag(r.head).toUpperCase(), w: TL.names, h: TL.row, tx: 14 - TL.names }, TL.names / 2, y));
    const n = r.n, ele = cy.getElementById(String(n.id)), d = datesOf(n);
    const mark = !d ? 'mk-none' : isSummary(n) ? 'mk-sum' : isPoint(n) || d[0] === d[1] ? 'mk-pt' : 'mk-bar';
    const x1 = d ? xOf(d[0]) : 0, x2 = d ? xOf(d[1]) : 0;
    const size = isPoint(n) ? 16 : 10;
    const w = mark === 'mk-none' ? TL.names - 8 : mark === 'mk-pt' ? size : Math.max(x2 - x1, mark === 'mk-sum' ? 4 : 6);
    const h = mark === 'mk-none' ? TL.row - 4 : mark === 'mk-pt' ? size : mark === 'mk-sum' ? 6 : TL.bar;
    const x = mark === 'mk-none' ? TL.names / 2 : mark === 'mk-pt' ? x1 : x1 + w / 2;
    const pct = n.rollup && n.rollup.total ? Math.round(100 * n.rollup.done / n.rollup.total) : 0;
    ele.removeClass('mk-none mk-pt mk-bar mk-sum').addClass(mark).data({ w, h, pct }).position({ x, y });
    if (baseDue(n)) els.push(bg('tl-base', 'tl:base:' + n.id, { h: TL.bar + 8 }, xOf(baseDue(n)), y));
    if (d) marks.set(String(n.id), { id: String(n.id), x, y, h, x1: x - w / 2, x2: x + w / 2, pt: mark === 'mk-pt', from: mark === 'mk-sum' ? x + w / 2 : x - w / 2 - 4, end: x + w / 2 + 6 + ctx.measureText(ele.data('label')).width });
    const title = (isSummary(n) ? (open.has(n.id) ? '▾ ' : '▸ ') : '') + '#' + n.id + ' ' + n.title;
    els.push(bg('tl-name', 'tl:name:' + i, { name: clampLabel(title, TL.names - 28 - r.depth * TL.indent, 1), of: String(n.id), w: TL.names, h: TL.row, tx: 14 + r.depth * TL.indent - TL.names }, TL.names / 2, y));
  });
  const width = Math.max(left + (hi - lo) * TL.px, ...[...marks.values()].map(m => m.end)) + 12;
  spans.forEach(([from, to, head, undated], i) => undated || els.push(stripe('tl:rag:' + i, (to - from) * TL.row, 4, TL.head + (from + to) * TL.row / 2, head)));
  spans.forEach(([from, to], i) => els.push(bg('lane-bg', 'tl:band:' + i, { name: '', w: width, h: (to - from) * TL.row, tx: 0, shade: i % 2 ? '#171b22' : '#14181e' }, width / 2, TL.head + (from + to) * TL.row / 2)));
  const begin = new Date(lo * 864e5);
  for (let m = new Date(Date.UTC(begin.getUTCFullYear(), begin.getUTCMonth() + 1, 1)); m / 864e5 <= hi; m.setUTCMonth(m.getUTCMonth() + 1)) {
    const at = m / 864e5, month = m.getUTCMonth();
    els.push(bg('tl-grid', 'tl:grid:' + at, { name: MONTHS[month] + (month === 0 ? ' ' + m.getUTCFullYear() : ''), h: height }, left + (at - lo) * TL.px, height / 2));
  }
  const tx = xOf(today);
  els.push(bg('tl-pin', 'tl:today', { name: 'Today ' + day(today) }, tx, TL.head - 4), bg('tl-pin', 'tl:today-end', { name: '' }, tx, height));
  els.push({ group: 'edges', classes: 'bg tl-today', data: { id: 'tl:today-line', source: 'tl:today', target: 'tl:today-end' } });
  cy.add(els);
  const hot = conflictEdges(open);
  const critical = depsMode === 'critical' ? criticalEdges(open) : new Set();
  const drawn = links().filter(e => {
    const wanted = hot.has(e.id()) || depsMode === 'all' || critical.has(e.id());
    return wanted && !e.data('kind').includes('partof') && marks.has(e.source().id()) && marks.has(e.target().id());
  });
  links().not(drawn).addClass('tl-off');
  drawn.addClass('tl-dep');
  drawn.filter(e => critical.has(e.id())).addClass('tl-critical');
  drawn.filter(e => hot.has(e.id())).addClass('tl-conflict');
  routeDeps(drawn.toArray(), marks, width);
  if (fit) fitView();
}

function layout(fit = true) {
  if (fit) keepWhole = false;
  fitBar();
  cy.elements('.bg').remove();
  cy.edges().removeStyle().removeClass('back tl-off tl-dep tl-critical tl-conflict');
  cy.elements().toggleClass('lanes', view === 'lanes').toggleClass('tl', view === 'timeline');
  if (view === 'lanes') layoutLanes(fit);
  else if (view === 'timeline') layoutTimeline(fit);
  else {
    cy.layout({ name: 'dagre', rankDir: 'BT', nodeSep: 40, rankSep: 80, edgeSep: 20, nodeDimensionsIncludeLabels: true, animate: false, fit: false }).run();
    if (fit) fitView();
  }
}

// Fit like cy.fit, but leave the bottom strip under the legend free so it never covers a node.
function fitTarget(eles = cy.elements(), pad = 40) {
  if (eles.empty()) return null;
  const bb = eles.boundingBox();
  const box = $('cy').getBoundingClientRect(), legend = $('legend').getBoundingClientRect();
  const reserve = Math.max(pad, box.bottom - legend.top + 12);
  const w = box.width - 2 * pad, h = box.height - pad - reserve;
  const zoom = Math.min(MAX_FIT, Math.max(cy.minZoom(), Math.min(w / Math.max(bb.w, 1), h / Math.max(bb.h, 1))));
  return { zoom, pan: { x: pad + (w - zoom * bb.w) / 2 - zoom * bb.x1, y: pad + (h - zoom * bb.h) / 2 - zoom * bb.y1 } };
}

// Too big to show whole at a readable zoom: show the start of the plan at READABLE instead.
function anchored(zoom) {
  const box = $('cy').getBoundingClientRect();
  if (view === 'graph') {
    const shown = tasks(), objectives = shown.filter('[type="objective"]').sort((a, b) => a.id() - b.id());
    const g = shown.getElementById(String(goal));
    const a = g.nonempty() ? g : objectives.nonempty() ? objectives[0] : shown.min(n => n.position('y')).ele;
    if (a) {
      const bb = a.boundingBox();
      return { zoom, pan: { x: box.width / 2 - zoom * (bb.x1 + bb.x2) / 2, y: 40 - zoom * bb.y1 } };
    }
  }
  const bb = cy.elements().boundingBox();
  return { zoom, pan: { x: 40 - zoom * bb.x1, y: 40 - zoom * bb.y1 } };
}

// Automatic fits keep labels readable and let a big plan scroll; the Fit button (whole)
// always shows everything, however small, because that is what the person asked for.
function fitView(whole) {
  let t = fitTarget();
  if (!t) return;
  if (t.zoom < READABLE && !whole) t = anchored(READABLE);
  cy.viewport(t);
  userMoved = false;
}

// Until the viewer drags or zooms, the page keeps the plan fitted as data, expansion and the
// window change; after that it leaves their view alone.
let userMoved = false, keepWhole = false;
cy.on('dragpan scrollzoom pinchzoom', () => { userMoved = true; });

function covered() {
  const t = fitTarget();
  return !!t && t.zoom >= READABLE && hiddenTasks();
}

function hiddenTasks() {
  const box = $('cy').getBoundingClientRect(), l = $('legend').getBoundingClientRect();
  const legend = { x1: l.left - box.left, x2: l.right - box.left, y1: l.top - box.top, y2: l.bottom - box.top };
  return tasks().some(n => {
    const b = n.renderedBoundingBox();
    const hidden = b.x1 < 0 || b.y1 < 0 || b.x2 > box.width || b.y2 > box.height;
    return hidden || (b.x1 < legend.x2 && b.x2 > legend.x1 && b.y1 < legend.y2 && b.y2 > legend.y1);
  });
}

function fitIfOutside() {
  if (!userMoved && hiddenTasks()) return fitView(keepWhole);
  const target = covered() && fitTarget();
  if (target) cy.animate(target, { duration: 300 });
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (!userMoved && hiddenTasks()) fitView(keepWhole); }, 150);
});

function rebuild(keepView, flash) {
  syncLegend();
  const { nodes, edges, open } = visibleData();
  const before = new Set(tasks().map(n => n.id()));
  const sources = new Set(edges.map(e => e.source));
  cy.elements().remove();
  cy.add(nodes.map(n => ({ group: 'nodes', classes: classesOf(n, sources), data: nodeData(n, open) })));
  cy.add(edges.map(e => ({ group: 'edges', classes: e.kind + (byId.get(e.source)?.type === 'risk' ? ' threat' : ''), data: { id: e.id, source: String(e.source), target: String(e.target), kind: e.kind } })));
  if (pinned && cy.getElementById(String(pinned)).empty()) closePanel();
  layout(!keepView);
  if (keepView) {
    fitIfOutside();
    if (flash) {
      const added = tasks().filter(n => !before.has(n.id()));
      added.addClass('new');
      setTimeout(() => added.removeClass('new'), 1500);
    }
  }
  applySearch();
  refocus();
  syncEmpty();
}

// Say why the canvas is blank, and offer the one click that fills it.
function syncEmpty() {
  const project = $('project').value;
  const candidates = DATA.nodes.filter(n => !project || n.project === project);
  const action = $('emptyAction');
  $('empty').hidden = tasks().length > 0;
  if (tasks().length) return;
  let text;
  action.hidden = false;
  if (!candidates.length) {
    text = project ? `No tasks in ${project} yet.` : 'No tasks yet.';
    action.hidden = true;
  } else if ($('hideDone').checked && candidates.every(n => n.derived_status === 'done')) {
    text = candidates.length === 1 ? 'All 1 item is done.' : `All ${candidates.length} items are done.`;
    action.textContent = 'Show done';
    action.onclick = () => {
      $('hideDone').checked = false;
      rebuild();
    };
  } else {
    text = 'Nothing matches the current filters.';
    action.textContent = 'Reset filters';
    action.onclick = () => {
      types = new Set(TYPES);
      store.set('taskgraph.types', TYPES.join(','));
      $('search').value = '';
      syncControls();
      setGoal(null);
    };
  }
  $('emptyText').textContent = text;
}

function sameShape(nodes, edges) {
  return tasks().length === nodes.length && links().length === edges.length
    && nodes.every(n => cy.getElementById(String(n.id)).nonempty())
    && edges.every(e => {
      const ele = cy.getElementById(e.id);
      return ele.nonempty() && ele.data('kind') === e.kind;
    });
}

const GOAL_TYPES = ['milestone', 'objective'];
function fillGoals() {
  const select = $('goal');
  const project = projectSelect.value;
  const key = n => n.due ?? '9999-12-31';
  const byDate = (a, b) => (a.derived_status === 'done') - (b.derived_status === 'done') || (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : a.id - b.id);
  const list = DATA.nodes.filter(n => GOAL_TYPES.includes(n.type) && (!project || n.project === project)).sort(byDate);
  if (goal != null && byId.has(goal) && !list.some(n => n.id === goal)) list.unshift(byId.get(goal));
  const label = n => `#${n.id} ${n.title}` + (n.type === 'milestone' && n.due ? ` · ${day(n.due)}` : '') + (n.derived_status === 'done' ? ' · done' : '');
  select.replaceChildren(el('option', { value: '', textContent: 'All goals' }), ...list.map(n => el('option', { value: String(n.id), textContent: label(n) })));
  select.value = goal != null && byId.has(goal) ? String(goal) : '';
  select.classList.toggle('on', select.value !== '');
  const info = $('goalInfo');
  const scope = goalScope();
  info.hidden = !scope;
  if (!scope) return;
  const leaves = [...scope].map(i => byId.get(i)).filter(n => !isSummary(n) && n.type !== 'milestone' && n.type !== 'risk');
  const g = byId.get(goal);
  const verdict = g.derived_status === 'done' ? 'done' : g.outlook ? { at_risk: 'at risk', on_track: 'on track', unknown: 'outlook unknown' }[g.outlook.verdict] : null;
  info.textContent = [`${leaves.filter(n => n.derived_status === 'done').length}/${leaves.length} done`, verdict].filter(Boolean).join(' · ');
}

function setGoal(id) {
  goal = id != null && byId.has(id) ? id : null;
  fillGoals();
  setTitle();
  syncUrl(true);
  rebuild();
  if (pinned) openPanel(byId.get(pinned));
}

function addProjects() {
  const have = new Set(Array.from(projectSelect.options, o => o.value));
  DATA.projects.filter(p => !have.has(p)).forEach(p => projectSelect.append(el('option', { value: p, textContent: p })));
}

function applyData(next) {
  DATA = next;
  byId = new Map(DATA.nodes.map(n => [n.id, n]));
  addProjects();
  if (goal != null && !byId.has(goal)) {
    goal = null;
    setTitle();
    syncUrl();
  }
  fillGoals();
  syncLegend();
  const { nodes, edges, open } = visibleData();
  if (sameShape(nodes, edges)) {
    const sources = new Set(edges.map(e => e.source));
    nodes.forEach(n => {
      const ele = cy.getElementById(String(n.id));
      ele.data(nodeData(n, open));
      Object.entries(flagsOf(n, sources)).forEach(([k, on]) => ele.toggleClass(k, on));
    });
    if (view !== 'graph') {
      layout(false);
      fitIfOutside();
    }
  } else rebuild(true, true);
  if (!userMoved && hiddenTasks()) fitView(keepWhole);
  if (pinned) openPanel(byId.get(pinned));
  applySearch();
  refocus();
  syncEmpty();
}

function toggleExpand(id) {
  const open = new Set(expandedIds());
  if (!open.delete(id)) open.add(id);
  setExpanded(open);
  rebuild(true);
  if (pinned) openPanel(byId.get(pinned));
}

function reveal(id) {
  const open = new Set(expandedIds());
  const size = open.size;
  for (let n = byId.get(id); byId.has(n.parent); n = byId.get(n.parent)) open.add(n.parent);
  if (open.size !== size) {
    setExpanded(open);
    rebuild(true);
  }
  select(id, true);
}

function focusOn(n, fade) {
  const keep = n.union(n.predecessors()).union(n.successors());
  if (fade) cy.elements().not('.bg').addClass('faded');
  keep.removeClass('faded').addClass('hl');
  mirrorNames();
  return keep;
}

function refocus() {
  cy.elements().removeClass('faded hl');
  if (pinned) focusOn(cy.getElementById(String(pinned)), true);
  mirrorNames();
}

function mirrorNames() {
  cy.nodes('.tl-name[of]').forEach(b => {
    const t = cy.getElementById(b.data('of'));
    b.toggleClass('faded', t.hasClass('faded')).toggleClass('dim', t.hasClass('dim'));
  });
}

const searchQuery = () => $('search').value.trim().toLowerCase();
const searchHits = q => q ? DATA.nodes.filter(n => passes(n) && (n.title.toLowerCase().includes(q) || ('#' + n.id).includes(q))).sort((a, b) => a.id - b.id) : [];

function applySearch() {
  const q = searchQuery();
  const hits = new Set(searchHits(q).map(n => String(n.id)));
  tasks().forEach(n => n.toggleClass('dim', hits.size > 0 && !hits.has(n.id())));
  const at = searched.q === q && searched.at >= 0 && hits.size > 1 ? `${searched.at + 1} of ` : '';
  $('searchCount').textContent = !q ? '' : !hits.size ? 'No matches' : hits.size === 1 ? '1 match' : `${at}${hits.size} matches`;
  mirrorNames();
}

// Expand whatever hides a hit, so a match inside a collapsed summary is never just a dimmed screen.
let searchTimer, searched = { q: null, at: -1 };
function runSearch() {
  clearTimeout(searchTimer);
  const q = searchQuery();
  searched = { q, at: -1 };
  const open = new Set(expandedIds()), size = open.size;
  searchHits(q).forEach(h => { for (let n = h; byId.has(n.parent); n = byId.get(n.parent)) open.add(n.parent); });
  if (open.size !== size) {
    setExpanded(open);
    rebuild(true);
  } else applySearch();
}

function stepSearch(back) {
  if (searched.q !== searchQuery()) runSearch();
  const hits = searchHits(searched.q);
  if (!hits.length) return;
  searched.at = searched.at < 0 ? (back ? hits.length - 1 : 0) : (searched.at + (back ? -1 : 1) + hits.length) % hits.length;
  select(hits[searched.at].id, true);
  applySearch();
}

function clearSearch() {
  $('search').value = '';
  runSearch();
}

function badge(status) {
  const c = COLORS[status] || COLORS.blocked;
  return el('span', { className: 'badge', textContent: LABELS[status] || status, style: `background:${c.bg};color:${c.fg};border:1px solid ${c.bd}` });
}

function fmt(iso) {
  const d = new Date(iso);
  return !iso ? '-' : isNaN(d) ? String(iso) : day(d.toLocaleDateString('sv')) + ' ' + d.toLocaleTimeString([], HM);
}

const show = (k, v) => DATE_KEYS.includes(k) ? day(v) : k === 'estimate' ? v + ' h' : typeof v === 'string' ? v : JSON.stringify(v);
const row = (k, v) => el('tr', null, el('td', { textContent: k }), el('td', { textContent: v }));

// The chain with the least slack into an open milestone or objective, first step first, as `tg.py path` prints it.
const chainOf = n => n.outlook && n.derived_status !== 'done' ? (n.outlook.driving || []).filter(i => i !== n.id && byId.has(i)) : [];

function refList(ids) {
  if (!ids.length) return el('div', { className: 'none', textContent: 'None' });
  return el('ul', null, ...ids.map(id => {
    const n = byId.get(id);
    const on = passes(n);
    const c = COLORS[n.derived_status] || COLORS.blocked;
    const li = el('li', { className: on ? '' : 'off' }, el('i', { style: `background:${c.bg};border:1px solid ${c.bd}` }), el('span', { textContent: '#' + n.id + ' ' + n.title }));
    if (on) li.onclick = () => reveal(id);
    return li;
  }));
}

function baselineText(n) {
  const b = n.baseline;
  const delta = b.due && n.due ? Math.round(dnum(n.due) - dnum(b.due)) : null;
  return (b.due ? day(b.due) : 'none') + (delta ? ` (${delta > 0 ? '+' : ''}${delta}d)` : '') + ' · ' + b.label;
}

function conflictList(list) {
  return el('ul', null, ...list.map(c => {
    const on = byId.has(c.with) && passes(byId.get(c.with));

function select(id, center) {
  const node = cy.getElementById(String(id));

    if (view !== 'timeline') return cy.animate({ center: { eles: node } }, { duration: 250 });
    // Timeline: scroll the row to mid-height only. The name column is how a row is recognised,
    // so it stays in view; the panel carries the dates when the bar itself is off to the right.
    const z = cy.zoom(), box = $('cy').getBoundingClientRect();

  }
}

// Hover only highlights: on a projector a resting mouse must not fade the slide.

// A line explains itself: hover says who waits for whom and any date conflict in words;

function edgeConflicts(edge) {
  const open = expandedIds(), s = edge.source().id(), t = edge.target().id();
  return DATA.nodes.flatMap(n => (n.conflicts ?? []).filter(c => c.kind === 'dependency' && c.from === n.id && byId.has(c.to)
    && String(topOf(n, open).id) === s && String(topOf(byId.get(c.to), open).id) === t));
}
function edgeStory(edge) {
  const [s, t] = [edge.source(), edge.target()].map(n => byId.get(Number(n.id())));
  const lifted = edge.data('kind').includes('lifted') || edge.data('kind').includes('bridged');
  const head = edge.data('kind').includes('partof') ? `#${s.id} is part of #${t.id}` : `#${t.id} waits for ${lifted ? 'work in ' : ''}#${s.id}`;
  const clashes = edgeConflicts(edge).map(c => `#${c.from} is due ${day(c.due)} but #${c.to} needs it ${day(c.need)} (${-c.gap}d short)`);
  return [head, ...clashes].join(' · ');
}
cy.on('mouseover', 'edge', e => {
  if (e.target.hasClass('bg')) return;
  $('cy').title = edgeStory(e.target);
  e.target.addClass('hl');
});

cy.on('tap', 'edge', e => {

const syncUrl = push => {

// Save the whole view as filtered (not just what is on screen) with a title bar, without
// hover or selection fading; search dimming stays because it is a filter the viewer chose.
const VIEW_NAMES = { graph: 'Graph', lanes: 'Swimlane', timeline: 'Timeline' };
function exportTitle() {
  const g = goal != null && byId.has(goal) ? byId.get(goal) : null;
  return ['taskgraph', projectSelect.value || 'All projects', g && `#${g.id} ${g.title}`, VIEW_NAMES[view]].filter(Boolean).join(' · ');
}
function exportName() {
  const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'all';
  return ['taskgraph', slug(projectSelect.value || 'all-projects'), goal != null && 'goal-' + goal, view, DATA.today || new Date().toLocaleDateString('sv')].filter(Boolean).join('-') + '.png';
}
// The legend entries the page shows right now, as drawable items for the exported image.
async function legendItems() {
  const items = [...document.querySelectorAll('#legendBody .col > div')].filter(d => !d.hidden);
  return Promise.all(items.map(async d => {
    const text = d.textContent.trim(), svg = d.querySelector('svg'), swatch = d.querySelector('i');
    if (svg) {
      const image = new Image();
      image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
      await image.decode();
      return { text, image };
    }
    const css = getComputedStyle(swatch);
    const clear = c => !c || c === 'rgba(0, 0, 0, 0)' || c === 'transparent';
    return { text, fill: clear(css.backgroundColor) ? '#111418' : css.backgroundColor, border: css.borderTopColor, outline: css.outlineStyle !== 'none' ? css.outlineColor : null };
  }));
}

async function exportPng() {
  const faded = cy.elements('.faded'), lit = cy.elements('.hl');
  faded.union(lit).removeClass('faded hl');
  mirrorNames();
  let shot;
  try {
    shot = await cy.png({ output: 'blob-promise', full: true, scale: 2, maxWidth: 8000, maxHeight: 8000, bg: '#111418' });
  } finally {
    faded.addClass('faded');
    lit.addClass('hl');
    mirrorNames();
  }
  const img = await createImageBitmap(shot);
  const k = Math.max(1, img.width / 2400), head = Math.round(64 * k), pad = Math.round(24 * k);
  const key = await legendItems();
  const font = `${Math.round(14 * k)}px ${FONT}`, icon = { w: Math.round(34 * k), h: Math.round(20 * k) }, gap = Math.round(8 * k), rowH = Math.round(30 * k);
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = font;
  let x = pad, rows = 1;
  const placed = key.map(item => {
    const w = icon.w + gap + measure.measureText(item.text).width + 2 * gap;
    if (x + w > img.width - pad && x > pad) { x = pad; rows += 1; }
    const at = { ...item, x, row: rows - 1 };
    x += w;
    return at;
  });
  const foot = key.length ? rows * rowH + pad : 0;
  const canvas = Object.assign(document.createElement('canvas'), { width: img.width, height: img.height + head + foot });
  const g = canvas.getContext('2d');
  g.fillStyle = '#111418';
  g.fillRect(0, 0, canvas.width, canvas.height);
  g.textBaseline = 'middle';
  g.fillStyle = '#e5e7eb';
  g.font = `bold ${Math.round(22 * k)}px ${FONT}`;
  g.fillText(exportTitle(), pad, head * 0.36);
  g.fillStyle = '#9ca3af';
  g.font = `${Math.round(15 * k)}px ${FONT}`;
  g.fillText('As of ' + day(DATA.today || new Date().toLocaleDateString('sv')) + ' ' + todayYear + ($('hideDone').checked ? ' · done items hidden' : ''), pad, head * 0.74);
  g.drawImage(img, 0, head);
  g.font = font;
  g.fillStyle = '#9ca3af';
  placed.forEach(item => {
    const y = head + img.height + pad / 2 + item.row * rowH + rowH / 2;
    if (item.image) g.drawImage(item.image, item.x, y - icon.h / 2, icon.w, icon.h);
    else {
      const s = Math.round(16 * k), sx = item.x + (icon.w - s) / 2;
      if (item.outline) { g.strokeStyle = item.outline; g.lineWidth = 2 * k; g.strokeRect(sx - 2 * k, y - s / 2 - 2 * k, s + 4 * k, s + 4 * k); }
      g.fillStyle = item.fill;
      g.fillRect(sx, y - s / 2, s, s);
      g.strokeStyle = item.border; g.lineWidth = 2 * k; g.strokeRect(sx, y - s / 2, s, s);
    }
    g.fillStyle = '#9ca3af';
    g.fillText(item.text, item.x + icon.w + gap, y);
  });
  const blob = await new Promise(done => canvas.toBlob(done, 'image/png'));
  const link = el('a', { href: URL.createObjectURL(blob), download: exportName() });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}
$('exportPng').onclick = () => exportPng();

if (DATA.live) {
  let lastVersion = DATA.version;

  const setStatus = ok => {
    connected = ok;
    const when = new Date().toLocaleTimeString([], HM);
    $('stamp').replaceChildren(el('i', { className: 'dot ' + (ok ? 'on' : 'off') }), (ok ? 'Live · checked ' : 'Disconnected · tried ') + when);
  };
  const getJson = async path => {
    const r = await fetch(path, { cache: 'no-store' });
    if (!r.ok) throw new Error(path + ' ' + r.status);
    return r.json();
  };
  const poll = async force => {
    if (busy || (document.hidden && !force)) return;
    busy = true;
    let next = null;
    try {
      const { version } = await getJson('/version');
      if (force || !connected || version !== lastVersion) next = await getJson('/data.json');
      setStatus(true);
    } catch (e) {
      setStatus(false);
    }
    busy = false;
    if (next) {
      lastVersion = next.version;
      applyData(next);
    }
  };
  setStatus(true);
  setInterval(poll, 30000);
  document.addEventListener('visibilitychange', () => poll());
