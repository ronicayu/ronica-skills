<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>taskgraph</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #111418; color: #e5e7eb; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
:root { --bar: 80px; --panel-w: 0px; }
#toolbar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-direction: column; gap: 4px; padding: 5px 14px; background: #181c22; border-bottom: 1px solid #2a2f38; z-index: 3; font-size: 13px; }
#toolbar .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-height: 32px; }
#toolbar .row > * { flex: none; }
#toolbar select, #toolbar input[type=text], #toolbar button { background: #232830; color: #e5e7eb; border: 1px solid #343a45; border-radius: 6px; padding: 5px 8px; font: inherit; }
#toolbar button { cursor: pointer; white-space: nowrap; }
#toolbar input[type=number] { width: 64px; margin-left: auto; background: #232830; color: #e5e7eb; border: 1px solid #343a45; border-radius: 6px; padding: 3px 6px; font: inherit; }
#toolbar button:disabled { opacity: .45; cursor: default; }
#toolbar input::placeholder { color: #9ca3af; opacity: 1; }
#toolbar button:hover { background: #2d333d; }
#toolbar [hidden] { display: none; }
#toolbar .seg { display: flex; }
#toolbar .seg button { padding: 5px 6px; }
#toolbar .seg button { border-radius: 0; }
#toolbar .seg button:first-child { border-radius: 6px 0 0 6px; }
#toolbar .seg button:last-child { border-radius: 0 6px 6px 0; }
#toolbar .seg button + button { margin-left: -1px; }
#toolbar .seg button.on, #toolbar button.on, #toolbar input.on { background: #3b4658; border-color: #566176; color: #fff; }
#toolbar .row > .spacer { flex: 1 1 0; min-width: 0; }
#toolbar .goalinfo, #searchCount { color: #9ca3af; font-size: 12px; white-space: nowrap; }
#toolbar .stamp { color: #9ca3af; font-size: 12px; white-space: nowrap; }
#toolbar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
#toolbar .dot.on { background: #34d399; }
#toolbar .dot.off { background: #ef4444; }
#toolbar .menuWrap { position: relative; }
#toolbar .menu { display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 5; min-width: 220px; max-height: calc(100vh - var(--bar) - 16px); overflow-y: auto; padding: 6px; background: #181c22; border: 1px solid #2a2f38; border-radius: 8px; box-shadow: 0 6px 18px #0008; }
#toolbar .menu.right { left: auto; right: 0; }
#toolbar .menuWrap.open > .menu { display: block; }
#toolbar .menu .item { display: flex; width: 100%; justify-content: space-between; gap: 18px; background: none; border: 0; padding: 6px 8px; border-radius: 6px; text-align: left; }
#toolbar .menu .item:hover { background: #232830; }
#toolbar kbd { color: #9ca3af; font: 11px ui-monospace, monospace; border: 1px solid #343a45; border-radius: 4px; padding: 0 4px; }
#toolbar .grp { padding: 4px 4px 6px; }
#toolbar .grp + .grp { border-top: 1px solid #2a2f38; padding-top: 8px; }
#toolbar .grp.off { opacity: .5; }
#toolbar .h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; color: #9ca3af; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
#toolbar .h .note { text-transform: none; letter-spacing: 0; }
#toolbar .h .pick { margin-left: auto; text-transform: none; letter-spacing: 0; }
#toolbar .link { background: none; border: 0; padding: 0 2px; color: #93c5fd; font: inherit; }
#toolbar .link:hover { background: none; text-decoration: underline; }
#toolbar .opt { display: flex; align-items: center; gap: 8px; padding: 3px 4px; color: #e5e7eb; border-radius: 4px; cursor: pointer; white-space: nowrap; }
#toolbar .opt:hover { background: #232830; }
#toolbar .opt .n { margin-left: auto; padding-left: 12px; color: #9ca3af; font-size: 12px; }
#toolbar .opt i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#toolbar .list { max-height: 168px; overflow-y: auto; }
#filters { width: 300px; }
#toolbar #chips { display: flex; gap: 6px; flex: 0 1 auto; min-width: 0; overflow: hidden; }
#toolbar .chip { display: inline-flex; align-items: center; flex: 0 1 auto; min-width: 48px; max-width: 260px; padding: 1px 2px 1px 10px; border-radius: 12px; background: #2b3442; border: 1px solid #3d4a5e; font-size: 12px; white-space: nowrap; }
#toolbar .chip span { overflow: hidden; text-overflow: ellipsis; }
#toolbar .chip button { background: none; border: 0; padding: 0 6px; color: #9ca3af; font-size: 15px; line-height: 1; }
#toolbar .chip button:hover { color: #e5e7eb; }
#toolbar .combo { position: relative; flex: 0 1 280px; min-width: 150px; }
#toolbar #goal { width: 100%; padding-right: 22px; text-overflow: ellipsis; }
#toolbar .caret { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: #9ca3af; pointer-events: none; font-size: 11px; }
#toolbar #goalList { width: max(100%, 380px); max-height: 60vh; }
#toolbar .choice { display: flex; gap: 12px; padding: 5px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
#toolbar .choice span:first-child { overflow: hidden; text-overflow: ellipsis; }
#toolbar .choice .when { margin-left: auto; color: #9ca3af; flex: none; }
#toolbar .choice.active { background: #2d333d; }
#toolbar .choice.done { color: #9ca3af; }
#toolbar .group { padding: 6px 8px 2px; color: #9ca3af; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
#toolbar .menu .none { padding: 5px 8px; color: #9ca3af; }
#toolbar .box { position: relative; display: flex; }
#toolbar #search { width: 200px; padding-right: 24px; }
#toolbar #searchClear { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); background: none; border: 0; padding: 0 6px; color: #9ca3af; font-size: 15px; line-height: 1; }
#toolbar #searchClear:hover { color: #e5e7eb; }
#toolbar #results { width: 460px; max-height: 60vh; }
#toolbar .hit { align-items: center; }
#toolbar .hit i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#toolbar .hit .when { max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
#banner { margin: 0 -14px -5px; padding: 3px 14px; background: #f59e0b; color: #1c1004; font-size: 12px; }
#banner[hidden] { display: none; }
#toolbar #banner button { margin-left: 6px; padding: 0 8px; background: #1c1004; color: #fde68a; border-color: #1c1004; }
#tip { position: fixed; z-index: 10; max-width: 420px; padding: 5px 9px; background: #0b0e12; border: 1px solid #343a45; border-radius: 6px; color: #e5e7eb; font-size: 12px; pointer-events: none; box-shadow: 0 4px 12px #0008; }
#tip[hidden] { display: none; }
#cy { position: fixed; top: var(--bar); left: 0; right: 0; bottom: 0; }
#legend { position: fixed; left: 14px; bottom: 14px; max-width: calc(100vw - 28px - var(--panel-w, 0px)); background: #181c22cc; border: 1px solid #2a2f38; border-radius: 8px; padding: 4px 10px 6px; font-size: 12px; z-index: 2; }
#legendBody { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; }
#legend .col { display: contents; }
#legend.closed { padding-bottom: 4px; }
#legend.closed #legendBody { display: none; }
#legendToggle { background: none; border: 0; padding: 0; color: #9ca3af; font: inherit; font-size: 12px; cursor: pointer; }
#legendToggle:hover { color: #e5e7eb; }
#legend .col div { display: flex; align-items: center; gap: 6px; margin: 0; }
#legend .col div[hidden] { display: none; }
#legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; box-sizing: border-box; }
#legend svg { flex: none; overflow: visible; }
#panel { position: fixed; top: var(--bar); right: 0; bottom: 0; width: 340px; min-width: 320px; max-width: 520px; background: #181c22; border-left: 1px solid #2a2f38; padding: 16px; overflow-y: auto; display: none; z-index: 2; }
#panel h2 { margin: 0 0 6px; padding-right: 30px; font-size: 17px; line-height: 1.3; }
#panel .sub { color: #9ca3af; margin-bottom: 12px; }
#panel h3 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #9ca3af; }
#panel .badge { display: inline-block; padding: 1px 9px; border-radius: 10px; font-weight: 600; font-size: 12px; }
#panel .badge.late { background: #ef4444; color: #fff; border: 1px solid #ef4444; }
#panel .badge.chase { background: #f59e0b; color: #1c1004; border: 1px solid #f59e0b; }
#panel button { margin-top: 10px; background: #232830; color: #e5e7eb; border: 1px solid #343a45; border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer; }
#panel button:hover { background: #2d333d; }
#panel #panelClose { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; margin-top: 0; padding: 0; font-size: 18px; line-height: 1; }
#panel .notes { white-space: pre-wrap; background: #1e232b; border-radius: 6px; padding: 8px 10px; }
#panel table { width: 100%; border-collapse: collapse; }
#panel td { padding: 3px 6px; border-bottom: 1px solid #2a2f38; vertical-align: top; word-break: break-word; }
#panel td:first-child { color: #9ca3af; width: 35%; }
#panel ul { list-style: none; margin: 0; padding: 0; }
#panel li { padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
#panel li:hover { background: #232830; }
#panel li.off { opacity: .45; cursor: default; }
#panel li i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#panel .none, #panel .muted { color: #9ca3af; }
#panel a { color: #93c5fd; }
#panel .badge + .badge { margin-left: 4px; }
#panel .badge.risk { background: #f59e0b22; color: #fbbf24; border: 1px solid #f59e0b; }
#panel .badge.conflict { background: #ef444422; color: #fca5a5; border: 1px solid #ef4444; }
#panel h3.red { color: #fca5a5; }
#panel h3.amber { color: #fbbf24; }
#panel .lead { margin: 8px 0 2px; color: #9ca3af; font-size: 12px; }
#panel li small { margin-left: auto; padding-left: 8px; color: #9ca3af; font-size: 12px; white-space: nowrap; }
#panel li.plain { cursor: default; }
#panel li.plain:hover { background: none; }
#panel li.plain i { margin-top: 5px; align-self: flex-start; }
#panel .overdue { color: #fbbf24; }
#panel .tag { display: inline-block; margin: 0 4px 3px 0; padding: 0 8px; border-radius: 10px; background: #2b3442; border: 1px solid #3d4a5e; font-size: 12px; }
#panel .actions button { margin-right: 6px; }
#panel .link { margin: 4px 0 0; padding: 0; background: none; border: 0; color: #93c5fd; cursor: pointer; }
#panel .link:hover { background: none; text-decoration: underline; }
#panel #panelBack { display: block; max-width: calc(100% - 36px); margin: 0 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
#panel .notes.clamp { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
#panel details { margin-top: 16px; }
#panel summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #9ca3af; }
#panel details table { margin-top: 6px; }
#panelGrip { position: fixed; top: var(--bar); bottom: 0; right: calc(var(--panel-w) - 3px); width: 6px; cursor: ew-resize; z-index: 3; }
#panelGrip:hover { background: #3b4658; }
#empty { position: fixed; top: var(--bar); left: 0; right: var(--panel-w, 0px); bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 1; }
#empty[hidden], #empty [hidden] { display: none; }
#empty p { margin: 0; font-size: 16px; color: #e5e7eb; }
#empty button { pointer-events: auto; margin-top: 10px; background: #232830; color: #e5e7eb; border: 1px solid #343a45; border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer; }
#empty button:hover { background: #2d333d; }
#loadView { position: fixed; top: var(--bar); left: 0; right: var(--panel-w, 0px); bottom: 0; overflow: auto; padding: 16px 20px 40px; z-index: 1; background: #111418; }
#loadView[hidden], #cy[hidden] { display: none; }
body[data-view="load"] #legend { display: none; }
.loadHead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; margin-bottom: 12px; }
.loadHead h2 { margin: 0; font-size: 16px; }
.loadKey { display: flex; align-items: center; gap: 6px; color: #9ca3af; font-size: 12px; }
.loadKey .sw { display: inline-block; width: 18px; height: 14px; border-radius: 3px; text-align: center; font-weight: 700; font-size: 11px; line-height: 14px; }
.loadKey .sw.over { margin-left: 10px; }
.loadKey .muted { margin-left: 10px; }
.loadScroll { overflow-x: auto; }
table.load { border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
table.load th { color: #9ca3af; font-weight: 600; font-size: 12px; padding: 4px 6px; text-align: right; white-space: nowrap; }
table.load th.name, table.load td.name { position: sticky; left: 0; z-index: 1; background: #111418; text-align: left; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 14px; }
table.load td.name { color: #e5e7eb; }
table.load td.c { min-width: 54px; height: 30px; padding: 0 8px; border-radius: 4px; text-align: right; font-size: 13px; cursor: pointer; }
table.load td.c.over { font-weight: 700; }
table.load td.c.zero { color: #6b7280; cursor: default; }
table.load td.c.on { outline: 2px solid #f9fafb; outline-offset: 1px; }
table.load td.extra { color: #9ca3af; text-align: right; padding: 0 8px; }
.loadPick, .loadMissing { margin-top: 16px; max-width: 640px; }
.loadPick h3 { margin: 0 0 6px; font-size: 13px; }
.loadPick ul, .loadMissing ul { list-style: none; margin: 0; padding: 0; }
.loadPick li, .loadMissing li { display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.loadPick li:hover, .loadMissing li:hover { background: #232830; }
.loadPick li i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.loadPick li small { margin-left: auto; color: #9ca3af; white-space: nowrap; }
.loadMissing summary { cursor: pointer; color: #9ca3af; }
#loadView .none { color: #9ca3af; }
#print { display: none; }
/* Printing (or Save as PDF) gives a sheet, not a screenshot of the controls: a title, the whole
   plan as filtered, the legend, and the open item's panel on its own page. */
@media print {
  @page { size: landscape; margin: 12mm; }
  html, body { height: auto; background: #fff; color: #111; }
  body > :not(#print) { display: none !important; }
  #print { display: block; font: 10pt/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print h1 { margin: 0 0 2pt; font-size: 15pt; }
  #print .sub { margin: 0 0 8pt; color: #444; }
  #print .plan { display: block; max-width: 100%; max-height: 150mm; margin: 0 auto; border-radius: 4pt; }
  #print .none { color: #444; }
  #print .key { display: flex; flex-wrap: wrap; gap: 3pt 14pt; margin-top: 6pt; padding: 5pt 8pt; border-radius: 4pt; background: #111418; color: #e5e7eb; font-size: 9pt; }
  #print .key div { display: flex; align-items: center; gap: 5pt; }
  #print .key i { width: 11pt; height: 11pt; border-radius: 3pt; display: inline-block; box-sizing: border-box; }
  #print .key svg { flex: none; overflow: visible; }
  #print .item { break-before: page; max-width: 170mm; }
  #print .loadPrint table.load { border-spacing: 1.5pt; font-size: 9pt; }
  #print .loadPrint table.load th { color: #444; padding: 2pt 4pt; }
  #print .loadPrint table.load td.name, #print .loadPrint table.load th.name { position: static; background: none; color: #111; }
  #print .loadPrint table.load td.c { height: 18pt; min-width: 0; padding: 0 5pt; border-radius: 2pt; }
  #print .loadPrint table.load td.zero { color: #999; }
  #print .loadPrint table.load td.extra { color: #444; }
  #print .loadPrint .loadHead h2 { display: none; }
  #print .loadPrint .loadKey, #print .loadPrint .muted, #print .loadPrint .none { color: #444; }
  #print .loadPrint details:not([open]) { display: none; }
  #print .loadPrint li { display: flex; gap: 6pt; padding: 1pt 0; }
  #print .loadPrint li i { width: 8pt; height: 8pt; border-radius: 50%; box-shadow: 0 0 0 1px #777; }
  #print .loadPrint li small { margin-left: auto; color: #444; }
  #print .item h2 { margin: 0 0 4pt; font-size: 14pt; }
  #print .item h3 { margin: 10pt 0 3pt; font-size: 9pt; text-transform: uppercase; letter-spacing: .06em; color: #444; break-after: avoid; }
  #print .item table { width: 100%; border-collapse: collapse; }
  #print .item td { padding: 2pt 5pt; border-bottom: 1px solid #ddd; vertical-align: top; }
  #print .item td:first-child { width: 30%; color: #444; }
  #print .item ul { list-style: none; margin: 0; padding: 0; }
  #print .item li { display: flex; gap: 6pt; align-items: center; padding: 1pt 0; break-inside: avoid; }
  #print .item li i { width: 8pt; height: 8pt; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px #777; }
  #print .item li small { margin-left: auto; color: #444; }
  #print .item .badge { display: inline-block; padding: 0 6pt; border-radius: 8pt; font-size: 8.5pt; font-weight: 600; }
  #print .item .badge + .badge { margin-left: 3pt; }
  #print .item .badge.late { background: #ef4444; color: #fff; }
  #print .item .badge.chase { background: #f59e0b; color: #1c1004; }
  #print .item .badge.risk { border: 1px solid #b45309; color: #b45309; }
  #print .item .badge.conflict { border: 1px solid #b91c1c; color: #b91c1c; }
  #print .item .tag { display: inline-block; margin: 0 3pt 2pt 0; padding: 0 6pt; border: 1px solid #bbb; border-radius: 8pt; font-size: 8.5pt; }
  #print .item .notes { white-space: pre-wrap; }
  #print .item .lead { margin: 4pt 0 1pt; color: #444; font-size: 9pt; }
  #print .item .muted { color: #444; }
  #print .item a { color: #1d4ed8; }
  #print .item summary { list-style: none; font-size: 9pt; text-transform: uppercase; letter-spacing: .06em; color: #444; margin-top: 10pt; }
}
</style>
</head>
<body>
<div id="toolbar">
  <div class="row" id="row1">
    <select id="project" title="Project"></select>
    <span class="combo menuWrap" id="goalWrap">
      <input type="text" id="goal" placeholder="All goals" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="goalList" title="Show only what one milestone or objective needs">
      <span class="caret">▾</span>
      <div class="menu" id="goalList" role="listbox"></div>
    </span>
    <span class="goalinfo" id="goalInfo" hidden></span>
    <span class="seg"><button id="viewGraph">Graph</button><button id="viewLanes">Swimlane</button><button id="viewTimeline">Timeline</button><button id="viewLoad" title="Hours per person per week, from estimates">Load</button></span>
    <span class="menuWrap" id="optsWrap"><button id="optsBtn" aria-haspopup="true" aria-expanded="false" title="View options">⚙ ▾</button>
      <div class="menu" id="opts">
        <div class="grp" id="lanesBy"><div class="h">Lanes by <span class="note" id="lanesNote">Swimlane and Timeline</span></div></div>
        <div class="grp" id="depsBy"><div class="h">Dependencies <span class="note" id="depsNote">Timeline only</span></div></div>
        <div class="grp" id="loadBy"><div class="h">Load by <span class="note">Load only</span></div>
          <label class="opt">Hours a week <input type="number" id="weekHours" min="1" max="168" step="1"></label></div>
        <div class="grp"><label class="opt"><input type="checkbox" id="legendOn"> Show legend</label></div>
      </div>
    </span>
    <span class="spacer"></span>
    <span class="menuWrap" id="searchWrap">
      <span class="box"><input type="text" id="search" placeholder="Search (press /)" size="9" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="results" title="Title, #id, owner, lane, team, tags or notes · Enter steps · Esc clears"><button id="searchClear" title="Clear search (Esc)" aria-label="Clear search" hidden>×</button></span>
      <div class="menu right" id="results" role="listbox"></div>
    </span>
    <span id="searchCount" aria-live="polite"></span>
    <span class="stamp" id="stamp"></span>
  </div>
  <div class="row" id="row2">
    <span class="menuWrap" id="filterWrap"><button id="filterBtn" aria-haspopup="true" aria-expanded="false" title="Filter by status, flags, type, owner and lane">Filter ▾</button>
      <div class="menu" id="filters"></div>
    </span>
    <span id="chips"></span>
    <button class="link" id="clearAll" hidden title="Remove every filter">Clear all</button>
    <span class="spacer"></span>
    <button id="fit" title="Show the whole plan (F)">Fit</button>
    <span class="menuWrap" id="moreWrap"><button id="moreBtn" aria-haspopup="true" aria-expanded="false" title="More actions">More ▾</button>
      <div class="menu right" id="more">
        <button class="item" id="expandAll" title="Expand all summaries">Expand all <kbd>E</kbd></button>
        <button class="item" id="collapseAll" title="Collapse all workstreams (objectives stay open)">Collapse all <kbd>C</kbd></button>
        <button class="item" id="relayout" title="Lay the view out again">Re-layout</button>
        <button class="item" id="exportPng" title="Save the whole current view as a PNG image">Export PNG</button>
        <button class="item" id="printPage" title="Print the whole current view, or save it as a PDF">Print…</button>
        <button class="item" id="refresh" hidden title="Check for changes now">Refresh now</button>
        <button class="item" id="copyView" title="Copy a link to exactly this view">Copy link to view</button>
      </div>
    </span>
  </div>
  <div id="banner" hidden></div>
</div>
<div id="cy"></div>
<div id="loadView" hidden></div>
<div id="legend">
  <button id="legendToggle" title="Show or hide the legend">Legend ▾</button>
  <div id="legendBody">
  <div class="col">
    <div><svg width="28" height="16"><rect x="1" y="2" width="26" height="12" rx="4" fill="#e5e7eb"/></svg>Task</div>
    <div><svg width="28" height="16"><polygon points="14,0 22,8 14,16 6,8" fill="#2f3744" stroke="#9ca3af" stroke-width="1.5"/></svg>Milestone</div>

// Cytoscape wraps only at spaces, so CJK and URLs never break and long titles spill out of
// fixed Swimlane boxes. Wrap here instead, breaking anywhere when a line has no space, and
// end the last allowed line with an ellipsis. Measured bold so goal labels fit as well.
const ctx = document.createElement('canvas').getContext('2d');
ctx.font = 'bold 13px ' + FONT;
const clamped = new Map();
function clampLabel(text, width, maxLines) {
  const key = width + ':' + maxLines + ':' + text;
  if (clamped.has(key)) return clamped.get(key);
  const fits = s => ctx.measureText(s).width <= width;
  const wide = c => /[\u2e80-\u9fff\uac00-\ud7af\uf900-\ufaff\uff00-\uffef]/.test(c);
  let rest = Array.from(text.trim().replace(/\s+/g, ' '));
  const lines = [];
  while (rest.length && lines.length < maxLines) {
    let n = rest.length;
    if (!fits(rest.join(''))) {
      n = 1;
      while (n < rest.length && fits(rest.slice(0, n + 1).join(''))) n++;
      const sp = rest.lastIndexOf(' ', n);
      if (rest[n] !== ' ' && !wide(rest[n - 1]) && !wide(rest[n]) && sp > 0) n = sp;
    }
    lines.push(rest.slice(0, n).join('').trim());
    rest = rest.slice(n);
    while (rest[0] === ' ') rest.shift();
  }
  if (rest.length) {
    let last = Array.from(lines.pop());
    while (last.length && !fits(last.join('').trimEnd() + '…')) last.pop();
    lines.push(last.join('').trimEnd() + '…');
  }
  const label = lines.join('\n');
  clamped.set(key, label);
  return label;
}

let goal = Number(query.get('goal')) || null;
let scopeMemo = { goal: null, data: null, ids: null };

// Everything a goal needs: what it depends on, followed all the way down (finished work too),
// the children of summaries on the way, dependencies inherited from parents, and the risks
// pointing at any of it. Ancestors come along so collapsed summaries still show.
function goalScope() {
  if (goal == null || !byId.has(goal)) return null;
  if (scopeMemo.goal === goal && scopeMemo.data === DATA) return scopeMemo.ids;
  const ids = new Set();
  const visit = id => {
    if (ids.has(id) || !byId.has(id)) return;
    ids.add(id);
    const n = byId.get(id);
    [...n.depends_on, ...n.children, ...(n.threats ?? [])].forEach(visit);
    for (let p = byId.get(n.parent); p; p = byId.get(p.parent)) p.depends_on.forEach(visit);
  };
  visit(goal);
  [...ids].forEach(id => {
    for (let p = byId.get(byId.get(id).parent); p; p = byId.get(p.parent)) ids.add(p.id);
  });
  scopeMemo = { goal, data: DATA, ids };
  return ids;
}

// keeps: what is in the plan being looked at (project, goal, finished work). Anything it drops

const keeps = n => {

    && (statuses.has('done') || n.derived_status !== 'done');

const ownerOf = n => {

const laneName = n => inheritedMeta(n, 'lane') ?? UNASSIGNED;
const flagList = n => [n.late_days != null && 'late', atRisk(n) && 'atrisk', conflicted(n) && 'conflict', n.chase_due && 'chase'].filter(Boolean);

  && (!owners || owners.has(ownerOf(n))) && (!lanes || lanes.has(laneName(n)));

let matchMemo = null;
function matchSet() {

  matchMemo = { data: DATA, ids };

const shows = n => types.has(n.type) && matchSet().has(n.id);
const passes = n => keeps(n) && shows(n);

// Which filters hide n, and the smallest change to each that brings it back.
function hiddenBy(n) {

  if (!statuses.has(n.derived_status)) out.push('status');
  if (!types.has(n.type)) out.push('type');

const HIDDEN_WORDS = { goal: 'outside the goal', project: 'in another project', status: 'by Status', type: 'by Types', flag: 'by Flags', owner: 'by Owner', lane: 'by Lane' };
function release(nodes) {

    else if (r === 'status') statuses.add(n.derived_status);

function topOf(n, open) {
  const chain = [n];
  while (byId.has(chain[0].parent)) chain.unshift(byId.get(chain[0].parent));
  return chain.find(a => !open.has(a.id)) || n;

function visibleData() {
  const open = expandedIds();
  const put = (map, s, t, f) => {
    if (s === t) return;
    const k = s + '-' + t, o = map.get(k);
    f = { partof: false, lifted: false, bridged: false, ...f };
    map.set(k, o ? { s, t, partof: o.partof && f.partof, lifted: o.lifted && f.lifted, bridged: o.bridged && f.bridged } : { s, t, ...f });
  };
  const level = DATA.nodes.filter(n => topOf(n, open) === n);
  const mapped = new Map();
  DATA.edges.forEach(e => {
    const a = topOf(byId.get(e.source), open).id, b = topOf(byId.get(e.target), open).id;
    put(mapped, a, b, { lifted: a !== e.source || b !== e.target });

  level.filter(p => p.children.length && open.has(p.id)).forEach(p => p.children.forEach(c => put(mapped, c, p.id, { partof: true })));
  const alive = new Set(level.filter(keeps).map(n => n.id));
  const shown = new Set(level.filter(n => alive.has(n.id) && shows(n)).map(n => n.id));
  const out = new Map([...alive].map(id => [id, []]));
  [...mapped.values()].filter(e => alive.has(e.s) && alive.has(e.t)).forEach(e => out.get(e.s).push(e));
  const result = new Map();
  const walk = (s, e, acc, seen) => {
    const f = { partof: acc.partof && e.partof, lifted: acc.lifted || e.lifted, bridged: acc.bridged };
    if (shown.has(e.t)) return put(result, s, e.t, f);
    if (seen.has(e.t)) return;
    seen.add(e.t);
    out.get(e.t).forEach(next => walk(s, next, { ...f, bridged: true }, seen));
  };
  shown.forEach(s => out.get(s).forEach(e => walk(s, e, { partof: true, lifted: false, bridged: false }, new Set())));

  [...result.values()].filter(e => !e.partof).forEach(e => next.get(e.s).push(e.t));

    for (let n = byId.get(id); byId.has(n.parent); n = byId.get(n.parent)) if (n.parent === p) return true;
    return false;

    const seen = new Set([from]);

// A collapsed summary must not hide trouble: count late and conflicting open work beneath it.
const collapsed = n => n.children.length > 0 && !expandedIds().has(n.id);

// Who to chase is the point of a chase-due external, so name the party rather than "chase due".
const chaseText = n => n.meta.party ? 'chase ' + n.meta.party : 'chase due';

function labelOf(n, open) {

    ? [m.owner, n.rollup && n.rollup.total ? `${n.rollup.done}/${n.rollup.total} done` : null]
    : (SUBTITLE[n.type] || SUBTITLE.task)(n);

  if (troubleText(n)) parts.unshift(troubleText(n));
  if (n.chase_due) parts.unshift(chaseText(n));
  if (conflicted(n)) parts.unshift('conflict');
  if (atRisk(n)) parts.unshift('at risk');
  if (n.late_days != null) parts.unshift(n.late_days + 'd late');

  const [titleLines, subLines] = view === 'lanes' ? [2, 1] : [3, 2];

const nodeData = (n, open) => ({ id: String(n.id), type: n.type, derived_status: n.derived_status, title: n.title, label: view === 'timeline' ? dateText(n) : labelOf(n, open) });
const flagsOf = (n, sources) => ({
  summary: isSummary(n),
  late: n.late_days != null || (collapsed(n) && trouble(n).late > 0),
  conflict: conflicted(n),
  atrisk: atRisk(n),
  goal: !sources.has(n.id) && (n.type === 'milestone' || n.type === 'objective')

const classesOf = (n, sources) => Object.entries(flagsOf(n, sources)).filter(([, on]) => on).map(([k]) => k).join(' ');
const tasks = () => cy.nodes().not('.bg');
const links = () => cy.edges().not('.bg');
const conflicted = n => (n.conflicts ?? []).length > 0;
const atRisk = n => !!(n.outlook && n.outlook.verdict === 'at_risk' && n.derived_status !== 'done');

  if (o.verdict === 'unknown') return 'Unknown · nothing upstream has a date';

const laneOf = n => {
  const v = LANE_KEYS[laneKey](n);

const gapAfter = c => GUTTER + (c + 1) * COL_W;

const groupBy = (items, key) => {
  const m = new Map();
  items.forEach(i => {
    const k = key(i);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(i);
  });

};

  const ends = [];

  items.forEach(it => {
    let j = 0;
    while (ends[j] !== undefined && it.lo - ends[j] <= 4) j++;
    ends[j] = it.hi;
    it.slot = j;
  });

function backEdges(nodes, edges) {
  const out = new Map(nodes.map(n => [n.id, []]));
  edges.forEach(e => out.get(e.source).push(e));
  const state = new Map();
  const back = new Set();
  const visit = id => {
    state.set(id, 1);
    out.get(id).forEach(e => {
      if (state.get(e.target) === 1) back.add(e.id);
      else if (!state.has(e.target)) visit(e.target);
    });
    state.set(id, 2);
  };
  nodes.forEach(n => state.has(n.id) || visit(n.id));
  return back;
}

function elbow(s, t, points) {
  const vx = t.x - s.x, vy = t.y - s.y, len2 = vx * vx + vy * vy;

    'segment-weights': points.map(([x, y]) => ((x - s.x) * vx + (y - s.y) * vy) / len2).join(' '),
    'segment-distances': points.map(([x, y]) => ((y - s.y) * vx - (x - s.x) * vy) / Math.sqrt(len2)).join(' ')

}

function routeEdges() {
  const rs = cy.edges().not('.back').map(edge => {
    const s = edge.source().position(), t = edge.target().position();
    const cs = colOf(s.x), ct = colOf(t.x);
    return { edge, s, t, sid: edge.source().id(), tid: edge.target().id(), a: gapAfter(cs), b: gapAfter(ct - 1), long: ct > cs + 1, base: s.y <= t.y ? t.y - ROW_H / 2 : t.y + ROW_H / 2 };

    g.sort((p, q) => p.s.y - q.s.y || p.sid - q.sid);

function layoutLanes() {
  const { nodes, edges } = visibleData();
  const back = backEdges(nodes, edges);
  const next = new Map(nodes.map(n => [n.id, []]));
  edges.filter(e => !back.has(e.id)).forEach(e => next.get(e.source).push(e.target));
  const up = new Map();
  const depth = id => {
    if (!up.has(id)) up.set(id, Math.max(-1, ...next.get(id).map(depth)) + 1);
    return up.get(id);
  };
  const maxUp = Math.max(0, ...nodes.map(n => depth(n.id)));
  const groups = new Map();
  nodes.forEach(n => {
    const name = laneOf(n);
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(n);
  });
  const names = [...groups.keys()].sort(bandOrder);
  const width = GUTTER + (maxUp + 1) * COL_W;
  let top = 0;
  const stripes = [];
  const bands = names.map((name, i) => {
    const rows = new Map();
    groups.get(name).sort((a, b) => a.id - b.id).forEach(n => {
      const col = maxUp - up.get(n.id);
      const row = rows.get(col) || 0;
      rows.set(col, row + 1);
      cy.getElementById(String(n.id)).position({ x: GUTTER + col * COL_W + COL_W / 2, y: top + row * ROW_H + ROW_H / 2 });
    });
    const height = Math.max(...rows.values()) * ROW_H;
    const band = {
      group: 'nodes', classes: 'lane-bg bg', locked: true, selectable: false, grabbable: false,
      data: { id: 'lane:' + i, name: clampLabel(name, LANE_W, 2) + '\n' + bandRag(name).toUpperCase(), w: width, h: height, tx: 14 - width, shade: i % 2 ? '#171b22' : '#14181e' },
      position: { x: width / 2, y: top + height / 2 }
    };
    stripes.push(stripe('lane-rag:' + i, height, 4, top + height / 2, name));

const dnum = s => {
  const [y, m, d] = s.split('-');

function layout(fit = true) {

// Dagre's best ranking (network simplex) takes about 1.4 s at 800 nodes; tight-tree draws a

    if (a) {
      const bb = a.boundingBox();

// Automatic fits keep labels readable and let a big plan scroll; the Fit button (whole)

function fitView(whole) {

  const box = $('cy').getBoundingClientRect(), l = $('legend').getBoundingClientRect();

  const under = b => b.x1 < legend.x2 && b.x2 > legend.x1 && b.y1 < legend.y2 && b.y2 > legend.y1;

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (!userMoved && hiddenTasks()) fitView(keepWhole); }, 150);

// Load: hours per person (or team, lane) per week, by the same rules as `tg.py load`. Each open
// item's estimate is spread evenly over the working days left in its window (start, or the

// week has only the working days left. It counts what the filters show, collapsed or not.

function rebuild(keepView, flash) {
  syncLegend();
  const loading = view === 'load';
  $('cy').hidden = loading;
  $('loadView').hidden = !loading;
  if (loading) {
    cy.batch(() => cy.elements().remove());
    renderLoad();
    applySearch();
    return syncEmpty();
  }
  const { nodes, edges, open } = visibleData();
  const before = new Set(tasks().map(n => n.id()));
  const sources = new Set(edges.map(e => e.source));
  cy.batch(() => {
    cy.elements().remove();
    cy.add(nodes.map(n => ({ group: 'nodes', classes: classesOf(n, sources), data: nodeData(n, open) })));
    cy.add(edges.map(e => ({ group: 'edges', classes: e.kind + (byId.get(e.source)?.type === 'risk' ? ' threat' : ''), data: { id: e.id, source: String(e.source), target: String(e.target), kind: e.kind } })));
  });
  if (pinned && cy.getElementById(String(pinned)).empty()) closePanel();
  layout(!keepView);
  if (keepView) {
    fitIfOutside();
    if (flash) {
      const added = tasks().filter(n => !before.has(n.id()));
      added.addClass('new');
      setTimeout(() => added.removeClass('new'), 1500);
    }
  }
  applySearch();
  refocus();
  syncEmpty();
}

// Say why the canvas is blank, and offer the one click that fills it.
function syncEmpty() {
  if (view === 'load') return void ($('empty').hidden = true);
  const project = $('project').value;
  const candidates = DATA.nodes.filter(n => !project || n.project === project);
  const action = $('emptyAction');
  $('empty').hidden = tasks().length > 0;
  if (tasks().length) return;
  let text;
  action.hidden = false;
  if (!candidates.length) {
    text = project ? `No tasks in ${project} yet.` : 'No tasks yet.';
    action.hidden = true;
  } else if (!statuses.has('done') && candidates.every(n => n.derived_status === 'done')) {
    text = candidates.length === 1 ? 'All 1 item is done.' : `All ${candidates.length} items are done.`;
    action.textContent = 'Show done';
    action.onclick = () => {
      statuses.add('done');
      filtersChanged();
    };
  } else {
    text = 'Nothing matches the current filters.';
    action.textContent = 'Reset filters';
    action.onclick = () => {
      $('search').value = '';
      clearAll();
    };
  }
  $('emptyText').textContent = text;
}

function sameShape(nodes, edges) {
  return tasks().length === nodes.length && links().length === edges.length
    && nodes.every(n => cy.getElementById(String(n.id)).nonempty())
    && edges.every(e => {
      const ele = cy.getElementById(e.id);
      return ele.nonempty() && ele.data('kind') === e.kind;
    });
}

const GOAL_TYPES = ['milestone', 'objective'];
function fillGoals() {
  showGoal();
  if (menuOpen('goalWrap')) renderGoalList(false);
  const info = $('goalInfo');
  const scope = goalScope();
  info.hidden = !scope;
  if (!scope) return;
  const leaves = [...scope].map(i => byId.get(i)).filter(n => !isSummary(n) && n.type !== 'milestone' && n.type !== 'risk');
  const g = byId.get(goal);
  const verdict = g.derived_status === 'done' ? 'done' : g.outlook ? { at_risk: 'at risk', on_track: 'on track', unknown: 'outlook unknown' }[g.outlook.verdict] : null;
  info.textContent = [`${leaves.filter(n => n.derived_status === 'done').length}/${leaves.length} done`, verdict].filter(Boolean).join(' · ');
}

function setGoal(id) {
  goal = id != null && byId.has(id) ? id : null;
  fillGoals();
  setTitle();
  syncUrl(true);
  rebuild();
  if (pinned) openPanel(byId.get(pinned));
}

function addProjects() {
  const have = new Set(Array.from(projectSelect.options, o => o.value));
  DATA.projects.filter(p => !have.has(p)).forEach(p => projectSelect.append(el('option', { value: p, textContent: p })));
}

function applyData(next) {
  const had = new Set(searchHits(searchQuery()).map(n => n.id));
  DATA = next;
  byId = new Map(DATA.nodes.map(n => [n.id, n]));
  addProjects();
  if (goal != null && !byId.has(goal)) {
    goal = null;
    setTitle();
    syncUrl();
  }
  fillGoals();
  syncLegend();
  matchMemo = null;
  autoOpen();
  const { nodes, edges, open } = visibleData();
  if (sameShape(nodes, edges)) {
    const sources = new Set(edges.map(e => e.source));
    nodes.forEach(n => {
      const ele = cy.getElementById(String(n.id));
      ele.data(nodeData(n, open));
      Object.entries(flagsOf(n, sources)).forEach(([k, on]) => ele.toggleClass(k, on));
    });
    if (view !== 'graph') {
      layout(false);
      fitIfOutside();
    }

  if (!userMoved && hiddenTasks()) fitView(keepWhole);

  const list = DATA.nodes.filter(n => GOAL_TYPES.includes(n.type) && (!project || n.project === project)).sort(byDate);
  if (goal != null && byId.has(goal) && !list.some(n => n.id === goal)) list.unshift(byId.get(goal));

}
function showGoal() {
  const g = goal != null && byId.has(goal) ? byId.get(goal) : null;
  goalBox.value = g ? goalLabel(g) + (g.type === 'milestone' && g.due ? ' · ' + day(g.due) : '') : '';

}
function renderGoalList(typed) {
  const q = typed ? goalBox.value.trim().toLowerCase() : '';

  goalChoices = [...(q ? [] : [null]), ...list];

  const multi = !projectSelect.value && new Set(list.map(n => n.project)).size > 1;
  const rows = [];

    if (multi && n && n.project !== last) rows.push(el('div', { className: 'group', textContent: (last = n.project) }));

      el('span', { textContent: n ? goalLabel(n) : 'All goals' }), el('span', { className: 'when', textContent: when })));

}
const pickGoal = i => {
  const n = goalChoices[i];

};
goalBox.onfocus = () => {

};

};
goalBox.onkeydown = e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {

    goalAt = Math.max(0, Math.min(goalChoices.length - 1, goalAt + (e.key === 'ArrowDown' ? 1 : -1)));
    $('goalList').querySelectorAll('.choice').forEach(c => c.classList.toggle('active', Number(c.dataset.i) === goalAt));

};

$('viewGraph').onclick = () => setView('graph');

$('legendStatus').append(...Object.keys(LABELS).map(s => el('div', { id: 'legend-' + s }, el('i', { style: `background:${COLORS[s].bg};border:2px solid ${COLORS[s].bd}` }), LABELS[s])));
$('legendMarks').prepend(el('div', null, el('i', { style: 'border:2px solid ' + GOAL }), 'Goal'), el('div', null, el('i', { style: 'border:2px solid #343b47;outline:2px solid #ef4444cc;outline-offset:1px;margin:0 2px' }), 'Late / conflict'), el('div', null, el('i', { style: 'border:2px solid #343b47;outline:2px solid #f59e0bcc;outline-offset:1px;margin:0 2px' }), 'At risk'));

// Esc closes the innermost thing first: a menu, then the search text, then the panel.
// Single keys work when no text box has focus: / search, F fit, E expand all, C collapse all.
const typing = t => t.matches && t.matches('input[type=text], input[type=number], input:not([type]), select, textarea');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.activeElement === $('search') && $('search').value) clearSearch();
    else if (closeMenus()) return;
    else if ($('panel').style.display === 'block') closePanel();
    return;
  }
  const panelOpen = $('panel').style.display === 'block';
  if (panelOpen && trail.length && ((e.altKey && e.key === 'ArrowLeft') || (e.key === 'Backspace' && !typing(e.target)))) {
    e.preventDefault();
    return goBack();
  }
  if (typing(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
  const key = e.key.toLowerCase();
  if (e.key === '/') {
    e.preventDefault();
    $('search').focus();
    $('search').select();
  } else if (key === 'f') $('fit').click();
  else if (key === 'e') $('expandAll').click();
  else if (key === 'c') $('collapseAll').click();
});
$('expandAll').onclick = () => {

// Save the whole view as filtered (not just what is on screen) with a title bar, without
// hover or selection fading; search dimming stays because it is a filter the viewer chose.
const VIEW_NAMES = { graph: 'Graph', lanes: 'Swimlane', timeline: 'Timeline', load: 'Load' };
function exportTitle() {
  const g = goal != null && byId.has(goal) ? byId.get(goal) : null;
  return ['taskgraph', projectSelect.value || 'All projects', g && `#${g.id} ${g.title}`, VIEW_NAMES[view]].filter(Boolean).join(' · ');
}
const exportFilters = () => [!statuses.has('done') && 'done items hidden', ...chipList().filter(c => c.key !== 'goal').map(c => c.text)].filter(Boolean).map(t => ' · ' + t).join('');
function exportName() {
  const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'all';
  return ['taskgraph', slug(projectSelect.value || 'all-projects'), goal != null && 'goal-' + goal, view, DATA.today || new Date().toLocaleDateString('sv')].filter(Boolean).join('-') + '.png';
}
// The legend entries the page shows right now, as drawable items for the exported image.
async function legendItems() {
  const items = [...document.querySelectorAll('#legendBody .col > div')].filter(d => !d.hidden);
  return Promise.all(items.map(async d => {
    const text = d.textContent.trim(), svg = d.querySelector('svg'), swatch = d.querySelector('i');
    if (svg) {
      const image = new Image();
      image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
      await image.decode();
      return { text, image };
    }
    const css = getComputedStyle(swatch);
    const clear = c => !c || c === 'rgba(0, 0, 0, 0)' || c === 'transparent';
    return { text, fill: clear(css.backgroundColor) ? '#111418' : css.backgroundColor, border: css.borderTopColor, outline: css.outlineStyle !== 'none' ? css.outlineColor : null };
  }));
}

async function exportPng() {
  const faded = cy.elements('.faded'), lit = cy.elements('.hl');
  faded.union(lit).removeClass('faded hl');
  mirrorNames();
  let shot;
  try {
    shot = await cy.png({ output: 'blob-promise', full: true, scale: 2, maxWidth: 8000, maxHeight: 8000, bg: '#111418' });
  } finally {
    faded.addClass('faded');
    lit.addClass('hl');
    mirrorNames();
  }
  const img = await createImageBitmap(shot);
  const k = Math.max(1, img.width / 2400), head = Math.round(64 * k), pad = Math.round(24 * k);
  const key = await legendItems();
  const font = `${Math.round(14 * k)}px ${FONT}`, icon = { w: Math.round(34 * k), h: Math.round(20 * k) }, gap = Math.round(8 * k), rowH = Math.round(30 * k);
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = font;
  let x = pad, rows = 1;
  const placed = key.map(item => {
    const w = icon.w + gap + measure.measureText(item.text).width + 2 * gap;
    if (x + w > img.width - pad && x > pad) { x = pad; rows += 1; }
    const at = { ...item, x, row: rows - 1 };
    x += w;
    return at;
  });
  const foot = key.length ? rows * rowH + pad : 0;
  const canvas = Object.assign(document.createElement('canvas'), { width: img.width, height: img.height + head + foot });
  const g = canvas.getContext('2d');
  g.fillStyle = '#111418';
  g.fillRect(0, 0, canvas.width, canvas.height);
  g.textBaseline = 'middle';
  g.fillStyle = '#e5e7eb';
  g.font = `bold ${Math.round(22 * k)}px ${FONT}`;
  g.fillText(exportTitle(), pad, head * 0.36);
  g.fillStyle = '#9ca3af';
  g.font = `${Math.round(15 * k)}px ${FONT}`;
  g.fillText('As of ' + day(DATA.today || new Date().toLocaleDateString('sv')) + ' ' + todayYear + exportFilters(), pad, head * 0.74);
  g.drawImage(img, 0, head);
  g.font = font;
  g.fillStyle = '#9ca3af';
  placed.forEach(item => {
    const y = head + img.height + pad / 2 + item.row * rowH + rowH / 2;
    if (item.image) g.drawImage(item.image, item.x, y - icon.h / 2, icon.w, icon.h);
    else {
      const s = Math.round(16 * k), sx = item.x + (icon.w - s) / 2;
      if (item.outline) { g.strokeStyle = item.outline; g.lineWidth = 2 * k; g.strokeRect(sx - 2 * k, y - s / 2 - 2 * k, s + 4 * k, s + 4 * k); }
      g.fillStyle = item.fill;
      g.fillRect(sx, y - s / 2, s, s);
      g.strokeStyle = item.border; g.lineWidth = 2 * k; g.strokeRect(sx, y - s / 2, s, s);
    }
    g.fillStyle = '#9ca3af';
    g.fillText(item.text, item.x + icon.w + gap, y);
  });
  const blob = await new Promise(done => canvas.toBlob(done, 'image/png'));
  const link = el('a', { href: URL.createObjectURL(blob), download: exportName() });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}
$('exportPng').onclick = () => exportPng();

// Print builds its sheet just before the browser lays the page out: the plan as one image (drawn
// synchronously, without hover or selection fading), the legend as text, and the open panel.
function printSheet() {
  const faded = cy.elements('.faded'), lit = cy.elements('.hl');
  faded.union(lit).removeClass('faded hl');
  mirrorNames();
  let shot = null;
  try {
    if (tasks().nonempty()) shot = cy.png({ output: 'base64uri', full: true, scale: 2, maxWidth: 6000, maxHeight: 6000, bg: '#111418' });
  } finally {
    faded.addClass('faded');
    lit.addClass('hl');
    mirrorNames();
  }
  const key = [...document.querySelectorAll('#legendBody .col > div')].filter(d => !d.hidden).map(d => d.cloneNode(true));
  const parts = [
    el('h1', { textContent: exportTitle() }),
    el('p', { className: 'sub', textContent: 'As of ' + day(DATA.today || new Date().toLocaleDateString('sv')) + ' ' + todayYear + exportFilters() }),
    view === 'load' ? el('div', { className: 'loadPrint' }, ...Array.from($('loadView').children, c => c.cloneNode(true)))
      : shot ? el('img', { className: 'plan', src: shot, alt: exportTitle() }) : el('p', { className: 'none', textContent: $('emptyText').textContent || 'Nothing to show.' }),
    shot && key.length ? el('div', { className: 'key' }, ...key) : null
  ];
  if ($('panel').style.display === 'block') {
    const item = el('div', { className: 'item' }, ...Array.from($('panel').children, c => c.cloneNode(true)));
    item.querySelectorAll('#panelGrip, #panelClose, #panelBack, .actions, #notesMore').forEach(e => e.remove());
    item.querySelectorAll('details').forEach(d => { d.open = true; });
    item.querySelectorAll('.clamp').forEach(e => e.classList.remove('clamp'));

  }

  $('print').querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
}
window.addEventListener('beforeprint', printSheet);

const setLegend = (open, save = true) => {

if (DATA.live) {
  let lastVersion = DATA.version;
  let connected = true;
  let busy = false;
  let lastOk = null;
  // A dot and the time; the words are in the tooltip, and losing the server gets a banner.
  const setStatus = ok => {
    connected = ok;
    const when = new Date().toLocaleTimeString([], HM);
    if (ok) lastOk = when;
    $('stamp').replaceChildren(el('i', { className: 'dot ' + (ok ? 'on' : 'off') }), lastOk || when);
    $('stamp').title = ok ? 'Live · checked ' + when : `Disconnected · tried ${when} · last good ${lastOk || 'never'}`;
    $('banner').hidden = ok;
    if (!ok) $('banner').replaceChildren(`Not live since ${lastOk || 'the page opened'} · the server is not answering, so this may be out of date.`,
      el('button', { id: 'retry', textContent: 'Retry', onclick: () => poll(true) }));
  };
  const getJson = async path => {
    const r = await fetch(path, { cache: 'no-store' });
    if (!r.ok) throw new Error(path + ' ' + r.status);
    return r.json();
  };
  const poll = async force => {
    if (busy || (document.hidden && !force)) return;
    busy = true;
    let next = null;
    try {
      const { version } = await getJson('/version');
      if (force || !connected || version !== lastVersion) next = await getJson('/data.json');
      setStatus(true);
    } catch (e) {
      setStatus(false);
    }
    busy = false;
    if (next) {
      lastVersion = next.version;
      applyData(next);
    }
  };
  setStatus(true);
  setInterval(poll, 30000);
  document.addEventListener('visibilitychange', () => poll());
  $('refresh').hidden = false;
  $('refresh').onclick = () => poll(true);
} else {
  $('stamp').textContent = 'Generated ' + fmt(DATA.generated_at);
}
