# Agentic Team project config. Copy to .agentic-team.toml in the repository
# root, or run /agentic-team:setup. Replace every "TODO". Omit a key to use
# its default. Never put credentials or secrets here. Private or
# machine-specific values go in .agentic-team.local.toml (gitignored); its
# keys override these. Field reference: plugins/agentic-team/README.md.

[taskgraph]
project = "TODO"            # required; `tg projects` lists names

[constraints]
forbidden = ["TODO"]        # one item per rule; [] when none applies. They become FORBIDDEN in every brief.

[autonomy]
grant = ""                  # "" means no standing full-autonomy grant
always_pause = []           # decisions that always need the operator

[sessions]
# max_parallel = 2
# permission_mode = "auto"
# timezone = "Asia/Singapore"
# timezone_label = "SGT"

[models]
# mechanical = "haiku"
# implementation = { model = "sonnet", effort = "high" }
# judgement = "opus"
# verifier = "opus"         # default: a different model from the worker's
# A tier table may add profile = "<name>" or a list of names, to start its sessions under another Claude profile
# (see [profiles]); a list balances by fewest live sessions, ties to the first.
# mechanical = { model = "haiku", profile = "api" }
# implementation = { model = "sonnet", effort = "high", profile = ["default", "api"] }

# [models.overrides]
# "data migration" = { model = "opus", effort = "high" }   # use as a task's `tier`

# Claude profiles for workers: name = the CLAUDE_CONFIG_DIR of that profile. "default" is the Manager's own and needs
# no entry. Paths are machine-specific: put [profiles] in .agentic-team.local.toml and keep the tiers here. Each profile
# needs the repository trusted and the agentic-team plugin installed (README: Workers on more than one Claude profile).
# [profiles]
# api = "~/.claude-api"

[notifications]
# skill = "telegram-send:telegram-send"

[merge]
# mode = "local"            # "pr": close pushes the task branch and opens a pull/merge request; record merges it under a MERGE: line
# host = "auto"             # "github" | "gitlab"; "auto" reads the remote URL. A self-managed GitLab needs "gitlab".
# remote = "origin"
# base = ""                 # "" = the host's default branch
# method = "merge"          # "merge" | "squash" | "rebase" (GitLab: the project setting decides; "squash" adds squash=true)
# catch_up = "host"         # a request behind its target: "host" asks the host to rebase it; "local" rebases the worktree and pushes
# draft = false             # true opens each request as a draft (no full CI until someone marks it ready); record reports pr-draft
# remove_worktrees = true # false: keep every worktree and session of a merged task (run.py removes nothing)
# disposable = []          # ignored paths that run.py may delete with a merged worktree, added to the defaults; "!build/" turns a default off (README: Disposable patterns)

[messaging]
# asks_per_attempt = 3      # asks a worker may file per attempt; 0 forbids them (a task's `asks` meta overrides; the mechanical tier defaults to 0)
# ask_due_minutes = 60      # an ask with no answer after this long prints ask-due
# pending_minutes = 10      # a message with no ack after this long counts as not delivered
# doorbell = "socket"       # "socket": post to the receiver's inbox socket, fall back to stop plus resume; "resume": stop plus resume only
# tg_poll_seconds = 5       # run.py wait reads Taskgraph this often (claude agents is read at --interval)

[verify]
# kind = "code"             # "code" | "schema" | "design-doc": the verify kind of a task without a verify_kind meta
