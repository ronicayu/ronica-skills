# Agentic Team project config. Copy to .agentic-team.toml in the repository
# root, or run /agentic-team:setup. Replace every "TODO". Omit a key to use
# its default. Never put credentials or secrets here. Private or
# machine-specific values go in .agentic-team.local.toml (gitignored); its
# keys override these. Field reference: plugins/agentic-team/README.md.

[taskgraph]
project = "TODO"            # required; `tg projects` lists names

[constraints]
forbidden = ["TODO"]        # one item per rule; [] when none applies. They become FORBIDDEN in every brief.

[autonomy]
grant = ""                  # "" means no standing full-autonomy grant
always_pause = []           # decisions that always need the operator

[sessions]
# max_parallel = 2
# permission_mode = "auto"
# timezone = "Asia/Singapore"
# timezone_label = "SGT"

[models]
# mechanical = "haiku"
# implementation = { model = "sonnet", effort = "high" }
# judgement = "opus"
# verifier = "opus"         # default: a different model from the worker's
# A tier table may add profile = "<name>" or a list of names, to start its sessions under another Claude profile
# (see [profiles]); a list balances by fewest live sessions, ties to the first.
# mechanical = { model = "haiku", profile = "api" }
# implementation = { model = "sonnet", effort = "high", profile = ["default", "api"] }

# A verifier per tier (a tier or a [models.overrides] key); it wins over `verifier`. Recommended: Sonnet verifies
# implementation work at half the price, Opus verifies judgement work. Unset: today's `verifier` rule.
# [models.verifier_by_tier]
# implementation = "sonnet"
# judgement = "opus"
# mechanical = "sonnet"

# [models.overrides]
# "data migration" = { model = "opus", effort = "high" }   # use as a task's `tier`

# Claude profiles for workers: name = the CLAUDE_CONFIG_DIR of that profile. "default" is the Manager's own and needs
# no entry. Paths are machine-specific: put [profiles] in .agentic-team.local.toml and keep the tiers here. Each profile
# needs the repository trusted and the agentic-team plugin installed (README: Workers on more than one Claude profile).
# [profiles]
# api = "~/.claude-api"

[notifications]
# skill = "telegram-send:telegram-send"

[merge]
# mode = "local"            # "pr": close pushes the task branch and opens a pull/merge request; record merges it under a MERGE: line
# host = "auto"             # "github" | "gitlab"; "auto" reads the remote URL. A self-managed GitLab needs "gitlab".
# remote = "origin"
# base = ""                 # "" = the host's default branch
# method = "merge"          # "merge" | "squash" | "rebase" (GitLab: the project setting decides; "squash" adds squash=true)
# catch_up = "host"         # a request behind its target: "host" asks the host to rebase it; "local" rebases the worktree and pushes
# after_rebase = ""        # a shell command run in the rebased tree after every rebase (e.g. test "$(alembic heads | wc -l)" -eq 1); a failure counts as a conflict
# draft = false             # true opens each request as a draft (no full CI until someone marks it ready); record reports pr-draft
# remove_worktrees = true # false: keep every worktree and session of a merged task (run.py removes nothing)
# disposable = []          # ignored paths that run.py may delete with a merged worktree, added to the defaults; "!build/" turns a default off (README: Disposable patterns)

[messaging]
# asks_per_attempt = 3      # asks a worker may file per attempt; 0 forbids them (a task's `asks` meta overrides; the mechanical tier defaults to 0)
# ask_due_minutes = 60      # an ask with no answer after this long prints ask-due
# pending_minutes = 10      # a message with no ack after this long counts as not delivered
# doorbell = "socket"       # "socket": post to the receiver's inbox socket, fall back to stop plus resume; "resume": stop plus resume only
# tg_poll_seconds = 5       # run.py wait reads Taskgraph this often (claude agents is read at --interval)

[verify]
# kind = "code"             # "code" | "schema" | "design-doc": the verify kind of a task without a verify_kind meta
# ci_ref_prefix = "ci-"     # verify --ci-ref pushes the worker's head to <prefix><id>-<attempt>; ends with - or /; match your CI's push filter

[scope]
# adjacent = []             # changes a worker may make outside a task's SCOPE without BLOCKED; off by default. Kinds:
#   "lower-ratchet"         #   only lower a baseline, ratchet or allow-list count (never raise it, never add an entry)
#   "stale-exemption"       #   delete an exemption or baseline row that a scanner run in this attempt proves stale
#   "own-lint"              #   fix lint or format errors that this attempt's change caused in files outside SCOPE
#   "own-dependents"        #   change a caller, test, fixture, generated file, doc or API sample of the code this attempt changes, as far as an ACCEPTANCE line, a VERIFY command or a gate that the brief names needs it
#   "own-registry"          #   add the entry that a check requires for a file this attempt adds, in a table that must list every file (never an exemption, a baseline row or an allow-list entry)
#   "convention-place"      #   put new code in the file where the repository's conventions place it (a schema file, a facade) when that file is outside SCOPE
#   "moved-path"            #   change the code that a SCOPE path meant, when that path is missing at the base and `git grep` finds that code in exactly one other place

[report]
# require_ran = { "code" = ["reuse:", "mutation:"], "design-doc" = ["self-check:"] }  # by verify kind: the line prefixes that a worker PASS report needs under Ran:; empty by default
# checks = ["make lint"]    # commands that check-report runs in the task worktree before it accepts a PASS; a non-zero exit refuses it, naming the command
# check_timeout_seconds = 600   # the time each check may take
# [report.checks_by_kind]   # the same by verify kind, run after `checks`
# design-doc = ["python docs/models/check_refs.py"]

[roles]
# default = ""              # the role of a task without a `role` meta: "architect", "software-engineer", or a project role (README: Roles)

[brief]
# carried_report_bytes = 3000   # most UTF-8 bytes of one carried report (previous attempt, upstream, worker report in a verify brief)
# carried_total_bytes = 12000   # most UTF-8 bytes of all carried reports of one brief; at least carried_report_bytes

[rounds]
# cap = 3                   # rounds (run.py round) a task may have without --attempt; a round does not count toward the attempt cap
# verify = "always"         # "always": a round's PASS goes to a verifier, whatever risk and kind; "by-risk": the rule of a plain attempt
