\* Sensitivity check: a failed row counts as live (#42 undone). Must break VerdictNotLost (a failed verifier) and NoDeadlock (a failed verifier, verify refused as still running).
SPECIFICATION Spec
CONSTANTS
  MAX_ATTEMPTS = 2
  MERGE_MODE = "local"
  HIGH_RISK = TRUE
  FULL_ENV = TRUE
  OPERATOR_PAUSES = FALSE
  REGRESS_42 = TRUE
  REGRESS_54 = FALSE
  REGRESS_56 = FALSE
  REGRESS_57 = FALSE
  REGRESS_58 = FALSE
  REGRESS_59 = FALSE
  REGRESS_61 = FALSE
  REGRESS_62 = FALSE
  REGRESS_65 = FALSE
  REGRESS_65B = FALSE
CONSTRAINT AttemptBound
INVARIANTS TypeOK VerdictNotLost NoMergeWithoutPassingVerdict PausedWipCommitted PauseFinishedFirst NoSessionLeftAtEnd
PROPERTIES AttemptCap LaunchCommitsLeftovers OneRequestPerTask StoppedIdleNeverRefuses
