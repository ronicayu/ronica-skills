\* Sensitivity check: the escalated attempt counts toward the cap (refuse_past_cap exempts only a pause). Must break NoDeadlock (at the cap the hint after an escalation says launch, and launch refuses).
SPECIFICATION Spec
CONSTANTS
  MAX_ATTEMPTS = 2
  MERGE_MODE = "local"
  HIGH_RISK = TRUE
  FULL_ENV = TRUE
  OPERATOR_PAUSES = FALSE
  FAULTS = FALSE
  ALLOW_UNCHECKED_REPORT = TRUE
  REGRESS_42 = FALSE
  REGRESS_54 = FALSE
  REGRESS_56 = FALSE
  REGRESS_57 = FALSE
  REGRESS_58 = FALSE
  REGRESS_59 = FALSE
  REGRESS_61 = FALSE
  REGRESS_62 = FALSE
  REGRESS_65 = FALSE
  REGRESS_89 = FALSE
  REGRESS_65B = FALSE
  REGRESS_97 = FALSE
  REGRESS_119 = FALSE
  ROUND_CAP = 2
  ROUND_VERIFY = "always"
  REVISION_CAP = 0
  SEAT = "own"
  REGRESS_127C = FALSE
  REGRESS_127H = FALSE
  REGRESS_127W = FALSE
  REGRESS_127A = FALSE
  ESCALATIONS = TRUE
  REGRESS_ESC_CAP = TRUE
CONSTRAINT AttemptBound RevisionBound
INVARIANTS TypeOK VerdictNotLost NoMergeWithoutPassingVerdict PausedWipCommitted PauseFinishedFirst NoSessionLeftAtEnd FixRoundNeedsBlocking DoneOnlyWhenMerged RoundIsInFlight ClosingVerdictOnFinalHead NoConcurrentWriters FindingsAckedBeforeReport
PROPERTIES EscalationKeepsAttempt AttemptCap LaunchCommitsLeftovers OneRequestPerTask StoppedIdleNeverRefuses NoHintAbandonsWaitingWork RevisionCap
