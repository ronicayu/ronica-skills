  REGRESS_42 = FALSE
  REGRESS_54 = FALSE
  REGRESS_56 = TRUE
  REGRESS_57 = FALSE
  REGRESS_58 = FALSE
  REGRESS_59 = FALSE
  REGRESS_61 = FALSE
  REGRESS_62 = FALSE
  REGRESS_65 = FALSE
