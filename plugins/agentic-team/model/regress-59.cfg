\* Sensitivity check: every STOPPED row is exempt from the cap (#59 undone). Must break AttemptCap (a recovery stop at the cap, then a launch past it).
SPECIFICATION Spec
CONSTANTS
  MAX_ATTEMPTS = 2
  MERGE_MODE = "local"
  HIGH_RISK = TRUE
  FULL_ENV = TRUE
  OPERATOR_PAUSES = FALSE
  REGRESS_42 = FALSE
  REGRESS_54 = FALSE
  REGRESS_56 = FALSE
  REGRESS_57 = FALSE
  REGRESS_58 = FALSE
  REGRESS_59 = TRUE
  REGRESS_61 = FALSE
  REGRESS_62 = FALSE
  REGRESS_65 = FALSE
  REGRESS_65B = FALSE
CONSTRAINT AttemptBound
INVARIANTS TypeOK VerdictNotLost NoMergeWithoutPassingVerdict PausedWipCommitted PauseFinishedFirst NoSessionLeftAtEnd
PROPERTIES AttemptCap LaunchCommitsLeftovers OneRequestPerTask StoppedIdleNeverRefuses
