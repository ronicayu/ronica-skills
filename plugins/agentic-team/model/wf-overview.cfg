\* Overview chart: the shipped hotfix workflow (impl -> test) with the escalation of a spec before impl, replace and cancel; no rechoose (MaxRechoose = 0), to stay under the chart budget of 500 states. Every rule holds.
SPECIFICATION Spec
CONSTANTS
  WF = "hotfix"
  MaxParts = 1
  MaxAdj = 2
  MaxRepl = 1
  MaxRechoose = 0
  OnTimeout = "approve"
  W4 = TRUE
  OPERATOR_FAIR = FALSE
  LATE_RULES = TRUE
  REGRESS_SINK_ORPHAN = FALSE
  REGRESS_RECHOOSE_RULES = FALSE
  REGRESS_SPLIT_APPROVAL = FALSE
  REGRESS_SKIP_RULE = FALSE
  REGRESS_ESCALATE_LOOP = FALSE
  REGRESS_NO_CONTRACT = FALSE
  REGRESS_DOWNGRADE_DONE_ONLY = FALSE
  REGRESS_INSERT_RUNNING = FALSE
  REGRESS_NO_DEFAULT = FALSE
CONSTRAINT AdjConstraint
INVARIANTS TypeOK Acyclic NoGhostDeps NoBypass SplitApprovalAfterAllParts RuleStagesKept EscalatedKept AdjBound NoSessionAfterEnd
PROPERTIES NoInsertIntoBusy Liveness
