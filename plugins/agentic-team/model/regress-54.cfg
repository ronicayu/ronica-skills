\* Sensitivity check: record no longer finishes a pause first (#54 undone). Must break NoDeadlock and PauseFinishedFirst (a recovery stop under a recorded verdict); if it stops breaking, the model has gone blind.
SPECIFICATION Spec
CONSTANTS
  MAX_ATTEMPTS = 2
  MERGE_MODE = "local"
  HIGH_RISK = TRUE
  FULL_ENV = TRUE
  OPERATOR_PAUSES = FALSE
  REGRESS_54 = TRUE
  REGRESS_42 = FALSE
  ALLOW_PAUSE_PAST_CAP = TRUE
  ALLOW_STUCK_AT_CAP = TRUE
  ALLOW_VERIFIER_LEFT_AT_END = TRUE
  ALLOW_IDLE_WORKER = TRUE
  ALLOW_PROMPT_AFTER_RESULT = TRUE
  ALLOW_BLOCKED_ROW_HIDES_VERDICT = TRUE
  ALLOW_RECOVERY_STOP_PAST_CAP = TRUE
CONSTRAINT AttemptBound
INVARIANTS TypeOK VerdictNotLost NoMergeWithoutPassingVerdict AttemptCap PausedWipCommitted PauseFinishedFirst NoSessionLeftAtEnd
PROPERTIES LaunchCommitsLeftovers OneRequestPerTask
