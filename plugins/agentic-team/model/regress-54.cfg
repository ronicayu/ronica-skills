  MAX_ATTEMPTS = 2
  MERGE_MODE = "local"
  HIGH_RISK = TRUE
  FULL_ENV = TRUE
  OPERATOR_PAUSES = TRUE
  FAULTS = FALSE
  ALLOW_UNCHECKED_REPORT = FALSE
  REGRESS_42 = FALSE
  REGRESS_54 = TRUE
  REGRESS_56 = FALSE
  REGRESS_57 = FALSE
  REGRESS_58 = FALSE
  REGRESS_59 = FALSE
  REGRESS_61 = FALSE
  REGRESS_62 = FALSE
  REGRESS_65 = FALSE
  REGRESS_65B = FALSE
CONSTRAINT AttemptBound
INVARIANTS TypeOK VerdictNotLost NoMergeWithoutPassingVerdict PausedWipCommitted PauseFinishedFirst NoSessionLeftAtEnd FixRoundNeedsBlocking
PROPERTIES AttemptCap LaunchCommitsLeftovers OneRequestPerTask StoppedIdleNeverRefuses
