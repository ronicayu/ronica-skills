\* Sensitivity check: no adjustment bound (escalate and downgrade any number of times, the escalated stage too). Must break AdjBound (escalate, downgrade the escalated stage, escalate again). EscalatedKept is left out here: the same loop breaks it one step earlier, and TLC reports only the first rule it breaks.
SPECIFICATION Spec
CONSTANTS
  WF = "check"
  MaxParts = 2
  MaxAdj = 2
  MaxRepl = 1
  MaxRechoose = 1
  OnTimeout = "approve"
  W4 = TRUE
  OPERATOR_FAIR = FALSE
  LATE_RULES = TRUE
  FIX_SINK_ORPHAN = TRUE
  FIX_RECHOOSE_RULES = TRUE
  REGRESS_SPLIT_APPROVAL = FALSE
  REGRESS_SKIP_RULE = FALSE
  REGRESS_ESCALATE_LOOP = TRUE
  REGRESS_NO_CONTRACT = FALSE
  REGRESS_DOWNGRADE_DONE_ONLY = FALSE
  REGRESS_INSERT_RUNNING = FALSE
  REGRESS_NO_DEFAULT = FALSE
CONSTRAINT AdjConstraint
INVARIANTS TypeOK Acyclic NoGhostDeps NoBypass SplitApprovalAfterAllParts RuleStagesKept AdjBound NoSessionAfterEnd
PROPERTIES NoInsertIntoBusy Liveness
