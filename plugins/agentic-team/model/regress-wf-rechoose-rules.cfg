  REGRESS_RECHOOSE_RULES = TRUE
  REGRESS_SPLIT_APPROVAL = FALSE
  REGRESS_SKIP_RULE = FALSE
  REGRESS_ESCALATE_LOOP = FALSE
  REGRESS_NO_CONTRACT = FALSE
  REGRESS_DOWNGRADE_DONE_ONLY = FALSE
  REGRESS_INSERT_RUNNING = FALSE
  REGRESS_NO_DEFAULT = FALSE
CONSTRAINT AdjConstraint
INVARIANTS TypeOK Acyclic NoGhostDeps NoBypass SplitApprovalAfterAllParts RuleStagesKept EscalatedKept AdjBound NoSessionAfterEnd
PROPERTIES NoInsertIntoBusy Liveness
