\* Sensitivity check: a passing close runs `tg done` at once, before the merge (before 0.19.0, #97). Must break DoneOnlyWhenMerged: close lists the branch as ready to merge and the task is done.
SPECIFICATION Spec
CONSTANTS
  MAX_ATTEMPTS = 2
  MERGE_MODE = "local"
  HIGH_RISK = TRUE
  FULL_ENV = TRUE
  OPERATOR_PAUSES = FALSE
  FAULTS = FALSE
  ALLOW_UNCHECKED_REPORT = TRUE
  REGRESS_42 = FALSE
  REGRESS_54 = FALSE
  REGRESS_56 = FALSE
  REGRESS_57 = FALSE
  REGRESS_58 = FALSE
  REGRESS_59 = FALSE
  REGRESS_61 = FALSE
  REGRESS_62 = FALSE
  REGRESS_65 = FALSE
  REGRESS_89 = FALSE
  REGRESS_65B = FALSE
  REGRESS_97 = TRUE
CONSTRAINT AttemptBound
INVARIANTS TypeOK VerdictNotLost NoMergeWithoutPassingVerdict PausedWipCommitted PauseFinishedFirst NoSessionLeftAtEnd FixRoundNeedsBlocking DoneOnlyWhenMerged
PROPERTIES AttemptCap LaunchCommitsLeftovers OneRequestPerTask StoppedIdleNeverRefuses
