\* Sensitivity check: run.py does not note the sessions it stops (part 3 of #65 undone), so a stopped idle/working row is a young ghost. Must break StoppedIdleNeverRefuses (launch stops the idle worker, then refuses on its ghost row); no dead end, because the ghost ends after 30 quiet minutes.
